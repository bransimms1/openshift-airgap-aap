---
# Parse an Airgap Architect export and derive everything the readiness checks
# expect to be true. No playbook in this repository contains a hostname: adding
# a node or a site changes the bundle, not the automation.
#
# Two things are worth knowing before changing this role.
#
# It reads the bundle with slurp rather than lookup('file'). The bundle lives on
# the host that unpacked it - a bastion in production - and a lookup would read
# the execution environment's own filesystem instead.
#
# It is re-runnable. On AAP running on OpenShift every workflow node is a
# separate pod, so a node cannot see a directory another node created. Any node
# that needs the parsed documents includes this role and re-derives them.

- name: Create this run's working directory
  ansible.builtin.file:
    path: "{{ bundle_workdir }}"
    state: directory
    mode: "0750"

# --- Acquire ----------------------------------------------------------------

- name: Check whether this host already has the bundle
  ansible.builtin.stat:
    path: "{{ bundle_workdir }}/install-config.yaml"
  register: _already_present

- name: DEMO - stage the sample bundle from the repository
  ansible.builtin.copy:
    src: "{{ demo_bundle_dir }}/"
    dest: "{{ bundle_workdir }}/"
    mode: "0640"
  when:
    - demo_mode | bool
    - not _already_present.stat.exists

- name: PRODUCTION - fetch the bundle
  ansible.builtin.get_url:
    url: "{{ bundle_url }}"
    dest: "{{ bundle_workdir }}/bundle.zip"
    mode: "0640"
  when:
    - not (demo_mode | bool)
    - not _already_present.stat.exists

- name: PRODUCTION - unpack the bundle
  ansible.builtin.unarchive:
    src: "{{ bundle_workdir }}/bundle.zip"
    dest: "{{ bundle_workdir }}"
    remote_src: true
  when:
    - not (demo_mode | bool)
    - not _already_present.stat.exists

# --- Record what is being validated -----------------------------------------

# The report names the exact input it validated. In production that is the
# archive; in demo mode there is no archive, so it is the install-config.
- name: Record the digest of the input
  ansible.builtin.stat:
    path: "{{ bundle_workdir }}/{{ 'install-config.yaml' if demo_mode | bool else 'bundle.zip' }}"
    checksum_algorithm: sha256
  register: _bundle_stat

- name: List what the bundle contains
  ansible.builtin.find:
    paths: "{{ bundle_workdir }}"
    recurse: true
    file_type: file
  register: _bundle_files

- name: Build the file list
  ansible.builtin.set_fact:
    bundle_contents: >-
      {{ _bundle_files.files | map(attribute='path') | map('relpath', bundle_workdir) | list }}

# --- Gate the export --------------------------------------------------------

- name: Assert the bundle contains what an install needs
  ansible.builtin.assert:
    that: item in bundle_contents
    fail_msg: >-
      Bundle is missing {{ item }}. This export cannot be used for an
      installation. Regenerate it from Airgap Architect.
    success_msg: "{{ item }} present"
  loop: "{{ bundle_required_files }}"

# Airgap Architect writes this marker when the export had unresolved warnings.
# It is a machine-readable statement that someone was told the configuration was
# not clean and exported anyway, so it should not silently become an install.
- name: Detect the draft marker
  ansible.builtin.set_fact:
    bundle_is_draft: "{{ bundle_draft_marker in bundle_contents }}"

- name: Refuse to proceed on a draft export
  ansible.builtin.fail:
    msg: >-
      {{ bundle_draft_marker }} is present in this bundle. The export had
      unresolved warnings. Resolve them in Airgap Architect and re-export, or
      record an explicit exception and set bundle_fail_on_draft=false.
  when:
    - bundle_is_draft | bool
    - bundle_fail_on_draft | bool

# --- Parse ------------------------------------------------------------------

- name: Read the configuration files off the host that unpacked them
  ansible.builtin.slurp:
    src: "{{ bundle_workdir }}/{{ item }}"
  register: _slurped
  loop: "{{ bundle_parse_files }}"
  when: item in bundle_contents
  loop_control:
    label: "{{ item }}"

- name: Decode and parse each document
  ansible.builtin.set_fact:
    _docs: >-
      {{ _docs | default({}) | combine({item.item: (item.content | b64decode | from_yaml)}) }}
  loop: "{{ _slurped.results | selectattr('content', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Bind the parsed documents
  ansible.builtin.set_fact:
    ic: "{{ _docs['install-config.yaml'] }}"
    isc: "{{ _docs['imageset-config.yaml'] }}"

- name: Bind agent-config when present (agent-based installs only)
  ansible.builtin.set_fact:
    ac: "{{ _docs['agent-config.yaml'] }}"
  when: "'agent-config.yaml' in _docs"

# --- Validate the contract, once --------------------------------------------
#
# Everything after this point reads the bundle as ordinary data. That is safe
# because this assertion establishes the shape first: a missing or empty field
# stops the run here, naming the field, instead of surfacing later as a template
# error inside a readiness check.
#
# Adding a new derived fact? Add its field to this assertion too.

- name: Assert the bundle matches the documented contract
  ansible.builtin.assert:
    that:
      - ic.metadata.name | default('') | length > 0
      - ic.baseDomain | default('') | length > 0
      - ic.platform.baremetal.apiVIPs | default([]) | length > 0
      - ic.platform.baremetal.ingressVIPs | default([]) | length > 0
      - ic.networking.machineNetwork | default([]) | length > 0
      - isc.apiVersion | default('') is search('v2alpha1')
    fail_msg: >-
      This export does not match the documented Airgap Architect contract.
      install-config.yaml needs metadata.name, baseDomain, a bare-metal platform
      with apiVIPs and ingressVIPs, and networking.machineNetwork.
      imageset-config.yaml must be an oc-mirror v2 ImageSetConfiguration
      (mirror.openshift.io/v2alpha1); v1 emits ImageContentSourcePolicy rather
      than IDMS/ITMS and the Day 2 tasks will not apply.
      Regenerate the export rather than editing it by hand.

# --- Derive -----------------------------------------------------------------

- name: Derive the facts every readiness check depends on
  ansible.builtin.set_fact:
    cluster_name: "{{ ic.metadata.name }}"
    base_domain: "{{ ic.baseDomain }}"
    cluster_fqdn: "{{ ic.metadata.name }}.{{ ic.baseDomain }}"
    api_vips: "{{ ic.platform.baremetal.apiVIPs }}"
    ingress_vips: "{{ ic.platform.baremetal.ingressVIPs }}"
    machine_networks: "{{ ic.networking.machineNetwork | map(attribute='cidr') | list }}"
    trust_bundle: "{{ ic.additionalTrustBundle | default('') }}"
    ocp_release: "{{ isc.mirror.platform.channels[0].minVersion | default('unknown') }}"
    ntp_sources: "{{ ac.additionalNTPSources | default([]) if ac is defined else [] }}"
    rendezvous_ip: "{{ ac.rendezvousIP | default(omit) if ac is defined else omit }}"

# imageDigestSources is the current spelling and imageContentSources the older
# one; bundles in the field still carry either. Each entry lists mirrors as
# host/path, and only the host is probed.
- name: Derive the mirror registry hosts
  ansible.builtin.set_fact:
    mirror_hosts: >-
      {{ _sources | map(attribute='mirrors') | flatten
         | map('split', '/') | map('first') | unique | list }}
  vars:
    _sources: "{{ ic.imageDigestSources | default(ic.imageContentSources, true) | default([]) }}"

# Every cluster needs these three. api-int is the one most often missed: someone
# testing by hand reaches the cluster through api and never queries api-int, but
# the control plane and the machine-config server both depend on it.
- name: Derive the cluster DNS records that must exist
  ansible.builtin.set_fact:
    expected_dns:
      - name: "api.{{ cluster_fqdn }}"
        expect: "{{ api_vips }}"
        why: external API endpoint
      - name: "api-int.{{ cluster_fqdn }}"
        expect: "{{ api_vips }}"
        why: control plane and machine-config server
      - name: "test.apps.{{ cluster_fqdn }}"
        expect: "{{ ingress_vips }}"
        why: wildcard *.apps must resolve to the ingress VIP

- name: Add the record each declared host must have
  ansible.builtin.set_fact:
    expected_dns: >-
      {{ expected_dns + [{'name': item.hostname ~ '.' ~ cluster_fqdn,
                          'expect': [],
                          'why': 'node record must resolve'}] }}
  loop: "{{ ac.hosts | default([]) }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: ac is defined

- name: Derive the host MACs that DHCP reservations must match
  ansible.builtin.set_fact:
    expected_macs: >-
      {{ expected_macs | default([])
         + [{'host': item.hostname,
             'macs': item.interfaces | map(attribute='macAddress') | list}] }}
  loop: "{{ ac.hosts | default([]) }}"
  loop_control:
    label: "{{ item.hostname }}"
  when: ac is defined

# --- Publish ----------------------------------------------------------------
#
# set_stats is how one workflow node hands data to the nodes that follow it. Six
# validation jobs share this single parse rather than each re-reading the bundle
# and disagreeing about defaults.

- name: Publish bundle facts to the workflow
  ansible.builtin.set_stats:
    data:
      bundle_sha256: "{{ _bundle_stat.stat.checksum }}"
      bundle_is_draft: "{{ bundle_is_draft }}"
      bundle_workdir: "{{ bundle_workdir }}"
      demo_mode: "{{ demo_mode | bool }}"
      demo_scenario: "{{ demo_scenario | default('passing') }}"
      cluster_name: "{{ cluster_name }}"
      cluster_fqdn: "{{ cluster_fqdn }}"
      base_domain: "{{ base_domain }}"
      api_vips: "{{ api_vips }}"
      ingress_vips: "{{ ingress_vips }}"
      machine_networks: "{{ machine_networks }}"
      ntp_sources: "{{ ntp_sources }}"
      mirror_hosts: "{{ mirror_hosts }}"
      ocp_release: "{{ ocp_release }}"
      expected_dns: "{{ expected_dns }}"
      expected_macs: "{{ expected_macs | default([]) }}"

- name: Show what was derived
  ansible.builtin.debug:
    msg: |
      {{ '*** DEMO MODE - sample bundle from the repository ***' if demo_mode | bool else '' }}
      Derived from {{ 'install-config' if demo_mode | bool else 'bundle' }} {{ _bundle_stat.stat.checksum[:12] }}
        working dir   : {{ bundle_workdir }}
        cluster       : {{ cluster_fqdn }}
        release       : {{ ocp_release }}
        api VIP(s)    : {{ api_vips | join(', ') }}
        ingress VIP(s): {{ ingress_vips | join(', ') }}
        machine net   : {{ machine_networks | join(', ') }}
        NTP           : {{ ntp_sources | join(', ') | default('none set', true) }}
        mirror        : {{ mirror_hosts | join(', ') }}
      {{ expected_dns | length }} DNS records derived from the bundle.
