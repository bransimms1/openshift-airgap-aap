---
# Parse an Airgap Architect export and derive what the readiness checks expect
# to be true. No playbook in this repository contains a hostname: adding a node
# or a site changes the bundle, not the automation.
#
# The role is re-runnable. On AAP running on OpenShift each workflow node is a
# separate pod, so a node cannot see a directory another node created. Any node
# needing the parsed documents includes this role and re-derives them.

- name: Load the bundle onto this host
  ansible.builtin.include_tasks: load_bundle.yml

- name: Validate the bundle against the documented contract
  ansible.builtin.include_tasks: validate_bundle.yml

- name: Derive the cluster facts the readiness checks use
  ansible.builtin.include_tasks: derive_cluster_facts.yml

- name: Publish those facts to the workflow
  ansible.builtin.include_tasks: publish_workflow_facts.yml
