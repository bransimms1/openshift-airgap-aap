---
# oauth-proxy uses this ServiceAccount as its OAuth client. The annotation
# registers the Route as the only redirect target. It needs no role bindings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: report-viewer
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"report-viewer"}}
