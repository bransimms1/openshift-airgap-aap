<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="bold" fill="#151515">Where AAP sits: before, around, and after</text>
  <text x="30" y="56" font-size="11" fill="#5a5a5a">Disconnected OpenShift bare-metal deployment — AAP appears three times because it is connective tissue, not a step</text>

  <g id="rows">
    <!-- 1 -->
    <rect x="30" y="80" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="80" width="36" height="52" rx="5" fill="#5a5a5a"/>
    <text x="48" y="112" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="80" y="102" font-size="12" font-weight="bold" fill="#151515">INFRASTRUCTURE</text>
    <text x="80" y="120" font-size="10" fill="#5a5a5a">Racks · BMCs · switches · DNS/DHCP/NTP · bastion · mirror registry · storage</text>
    <polygon points="44,136 52,136 48,146" fill="#b4b4b4"/>
    <!-- 2 -->
    <rect x="30" y="150" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="150" width="36" height="52" rx="5" fill="#06525b"/>
    <text x="48" y="182" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="80" y="172" font-size="12" font-weight="bold" fill="#06525b">AAP — READINESS AUTOMATION</text>
    <text x="80" y="190" font-size="10" fill="#5a5a5a">BIOS/firmware/RAID baseline · infrastructure validation · readiness report</text>
    <polygon points="44,206 52,206 48,216" fill="#b4b4b4"/>
    <!-- 3 -->
    <rect x="30" y="220" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="220" width="36" height="52" rx="5" fill="#cc0000"/>
    <text x="48" y="252" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="80" y="242" font-size="12" font-weight="bold" fill="#cc0000">AIRGAP ARCHITECT</text>
    <text x="80" y="260" font-size="10" fill="#5a5a5a">install-config · agent-config · imageset-config · NTP MachineConfigs · field manual</text>
    <polygon points="44,276 52,276 48,286" fill="#b4b4b4"/>
    <!-- 4 -->
    <rect x="30" y="290" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="290" width="36" height="52" rx="5" fill="#06525b"/>
    <text x="48" y="322" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="80" y="312" font-size="12" font-weight="bold" fill="#06525b">AAP — ORCHESTRATION</text>
    <text x="80" y="330" font-size="10" fill="#5a5a5a">Bundle intake &amp; gate · credential injection · ISO build · virtual-media boot</text>
    <polygon points="44,346 52,346 48,356" fill="#b4b4b4"/>
    <!-- 5 -->
    <rect x="30" y="360" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="360" width="36" height="52" rx="5" fill="#151515"/>
    <text x="48" y="392" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <text x="80" y="382" font-size="12" font-weight="bold" fill="#151515">OPENSHIFT INSTALLATION</text>
    <text x="80" y="400" font-size="10" fill="#5a5a5a">Agent-based installer · rendezvous host · bootstrap → control plane → workers</text>
    <polygon points="44,416 52,416 48,426" fill="#b4b4b4"/>
    <!-- 6 -->
    <rect x="30" y="430" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="430" width="36" height="52" rx="5" fill="#9a6b00"/>
    <text x="48" y="462" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <text x="80" y="452" font-size="12" font-weight="bold" fill="#9a6b00">GITOPS</text>
    <text x="80" y="470" font-size="10" fill="#5a5a5a">Argo CD bootstrap · cluster config as code · operators from the mirrored catalog</text>
    <polygon points="44,486 52,486 48,496" fill="#b4b4b4"/>
    <!-- 7 -->
    <rect x="30" y="500" width="580" height="52" rx="5" fill="#ffffff" stroke="#dddddd"/>
    <rect x="30" y="500" width="36" height="52" rx="5" fill="#06525b"/>
    <text x="48" y="532" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">7</text>
    <text x="80" y="522" font-size="12" font-weight="bold" fill="#06525b">AAP — DAY 2 AUTOMATION</text>
    <text x="80" y="540" font-size="10" fill="#5a5a5a">CSRs · MachineConfig · certificates · compliance · upgrades · event-driven remediation</text>
  </g>

  <!-- rails -->
  <rect x="640" y="80" width="230" height="210" rx="5" fill="#e7f0f1" stroke="#c9dadc"/>
  <text x="660" y="106" font-size="12" font-weight="bold" fill="#06525b">Governance rail</text>
  <text x="660" y="132" font-size="10" fill="#151515">• RBAC and team ownership</text>
  <text x="660" y="152" font-size="10" fill="#151515">• Approval gates between stages</text>
  <text x="660" y="172" font-size="10" fill="#151515">• Signed, versioned automation content</text>
  <text x="660" y="192" font-size="10" fill="#151515">• Activity stream as audit evidence</text>
  <text x="660" y="212" font-size="10" fill="#151515">• Notifications to the change record</text>

  <rect x="640" y="310" width="230" height="242" rx="5" fill="#f6f6f6" stroke="#dddddd"/>
  <text x="660" y="336" font-size="12" font-weight="bold" fill="#151515">Content supply chain</text>
  <text x="660" y="362" font-size="10" fill="#151515">• Private Automation Hub in the isolated segment</text>
  <text x="660" y="382" font-size="10" fill="#151515">• EEs built low-side, mirrored high-side</text>
  <text x="660" y="402" font-size="10" fill="#151515">• Collections pinned, signature-verified</text>
  <text x="660" y="422" font-size="10" fill="#151515">• Playbooks in internal Git, tagged per site</text>

  <text x="30" y="595" font-size="10" fill="#8a8a8a">Red Hat · Ansible Automation Platform × OpenShift Airgap Architect</text>
</svg>
