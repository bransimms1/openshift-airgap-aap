---
# Site B is a new inventory, not a new project. That is the whole scaling argument.
all:
  children:
    bastion:
      hosts:
        bastion-a.example.com:
          ansible_host: 10.42.10.20

    # BMC hosts are addressed over HTTPS (Redfish). Nothing is installed on them.
    # Connection is local: the EE talks to the BMC API, it does not log in to it.
    bmc:
      hosts:
        master-0-bmc:
          ansible_host: 10.42.20.11
          bmc_address: 10.42.20.11
          node_name: master-0
        master-1-bmc:
          ansible_host: 10.42.20.12
          bmc_address: 10.42.20.12
          node_name: master-1
        master-2-bmc:
          ansible_host: 10.42.20.13
          bmc_address: 10.42.20.13
          node_name: master-2
      vars:
        ansible_connection: local
        # Credentials come from the AAP custom credential type, never from here.
        bmc_username: "{{ lookup('env', 'BMC_USERNAME') }}"
        bmc_password: "{{ lookup('env', 'BMC_PASSWORD') }}"
        bmc_validate_certs: false   # lab only; true against real iDRAC/iLO with a trusted CA

    # Where read-only network assertions execute from. Must be the segment the
    # cluster will actually live on, or the answers are meaningless.
    validators:
      hosts:
        bastion-a.example.com:
