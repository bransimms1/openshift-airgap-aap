---
# Demo inventory. Everything runs inside the execution environment — there is
# no bastion, no BMC and no cluster.
#
# The groups keep the same names as a site inventory so the playbooks and the
# workflow graph are unchanged between demo and production. Only the inventory
# differs, which is what makes the automation portable between sites.
all:
  children:
    bastion:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    validators:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

    # Deliberately empty. There is no Redfish endpoint in demo mode; the BMC
    # check reports SIMULATED or SKIPPED and never dials out.
    bmc:
      hosts: {}
