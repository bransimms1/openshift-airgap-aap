---
# Validate the mirror registry: reachable, presenting a trust chain the cluster
# will accept, and actually holding the release payload.
#
# Reachability alone is not enough. The chain the registry presents has to match
# the CA in the bundle's additionalTrustBundle, as seen from this subnet, or
# every image pull fails with x509 errors after the install completes.
- name: Validate mirror registry reachability, trust and content
  hosts: validators
  gather_facts: false
  vars:
    # Used when a mirror host carries no explicit port.
    registry_default_port: 8443
    # This node's own scratch space. It reads nothing the intake node wrote:
    # trust_bundle arrives as a workflow artifact and is written out here, in
    # this pod, immediately before it is used.
    registry_workdir: "/tmp/registry-check-{{ awx_job_id | default('local', true) }}"
  tasks:

    # There is no mirror registry in demo mode, and dialling out to a name that
    # does not resolve would hang the branch.
    - name: DEMO - record the branch as simulated
      when: demo_mode | default(false) | bool
      block:
        - name: Publish simulated result
          ansible.builtin.set_stats:
            data:
              check_registry:
                status: SIMULATED
                hosts: "{{ mirror_hosts | default([]) }}"
                detail: >-
                  Demo mode. In production this fetches /v2/ over TLS validated
                  by the bundle's own additionalTrustBundle, reads the
                  certificate the registry presents, and probes for the release
                  payload.
        - name: End the play
          ansible.builtin.meta: end_play

    - name: Create this job's scratch directory
      ansible.builtin.file:
        path: "{{ registry_workdir }}"
        state: directory
        mode: "0750"

    - name: Write the bundle's additionalTrustBundle to disk
      ansible.builtin.copy:
        content: "{{ trust_bundle }}"
        dest: "{{ registry_workdir }}/trust-bundle.pem"
        mode: "0644"

    # mirror_hosts entries come from the bundle as host or host:port. The
    # certificate read needs the two separately, so split once here.
    - name: Split the first mirror host into address and port
      ansible.builtin.set_fact:
        registry_host: "{{ mirror_hosts[0] | split(':') | first }}"
        registry_port: >-
          {{ mirror_hosts[0] | split(':') | last if ':' in mirror_hosts[0]
             else registry_default_port }}

    - name: Registry /v2/ API must respond over TLS validated by that bundle
      ansible.builtin.uri:
        url: "https://{{ item }}/v2/"
        ca_path: "{{ registry_workdir }}/trust-bundle.pem"
        validate_certs: true
        status_code: [200, 401]   # 401 is fine - TLS and routing work
      loop: "{{ mirror_hosts }}"
      register: _reg
      failed_when: false

    - name: Read the certificate the registry actually presents
      community.crypto.get_certificate:
        host: "{{ registry_host }}"
        port: "{{ registry_port }}"
      register: _cert
      failed_when: false

    # 200 confirms the release repository is there. 401 means the endpoint
    # exists but the tag list needs credentials, so presence is neither proved
    # nor disproved - reported as UNCONFIRMED rather than counted as a pass.
    - name: Look for the release payload in the mirror
      ansible.builtin.uri:
        url: "https://{{ mirror_hosts[0] }}/v2/openshift/release-images/tags/list"
        ca_path: "{{ registry_workdir }}/trust-bundle.pem"
        status_code: [200, 401]
      register: _payload
      failed_when: false

    - name: Grade the three things this branch checks
      ansible.builtin.set_fact:
        unreachable_hosts: >-
          {{ _reg.results | rejectattr('status', 'in', [200, 401])
             | map(attribute='item') | list }}
        cert_read: "{{ _cert.not_after is defined }}"
        payload_state: >-
          {{ 'CONFIRMED' if _payload.status | default(0) == 200
             else ('UNCONFIRMED' if _payload.status | default(0) == 401 else 'MISSING') }}

    - name: Publish result
      ansible.builtin.set_stats:
        data:
          check_registry:
            status: >-
              {{ 'FAIL' if (unreachable_hosts or not cert_read or payload_state == 'MISSING')
                 else ('UNCONFIRMED' if payload_state == 'UNCONFIRMED' else 'PASS') }}
            hosts: "{{ mirror_hosts }}"
            unreachable: "{{ unreachable_hosts }}"
            cert_host: "{{ registry_host }}:{{ registry_port }}"
            cert_expires: "{{ _cert.not_after | default('unknown') }}"
            release_payload: "{{ payload_state }}"

    - name: Fail on an unreachable mirror, an unreadable chain, or a missing payload
      ansible.builtin.fail:
        msg: >-
          {% if unreachable_hosts %}
          {{ unreachable_hosts | join(', ') }} did not answer on /v2/. If this is
          a certificate error, the CA in additionalTrustBundle does not match
          what the registry presents, and the cluster will fail every image pull
          with x509 errors after install.
          {% elif not cert_read %}
          No certificate could be read from {{ registry_host }}:{{ registry_port }},
          so the trust chain could not be verified.
          {% else %}
          The release payload was not found in the mirror. oc-mirror did not
          publish it, or published it under a different path.
          {% endif %}
      when: unreachable_hosts or not cert_read or payload_state == 'MISSING'
