---
# Validate registry reachability, certificate trust, and release content.
# Reachability alone is not sufficient: the chain the registry presents must
# match the CA the cluster was configured to trust, as seen from this subnet.
- name: Validate mirror registry reachability, trust and content
  hosts: validators
  gather_facts: false
  vars:
    # Fallback only. The port actually checked is parsed from the mirror host
    # below, so a mirror published on 443 is not probed on 8443.
    registry_port_default: 8443
    # This node's own scratch space. It does not read anything the intake node
    # wrote: trust_bundle arrives as a workflow artifact and is written out
    # here, in this pod, immediately before it is used.
    registry_workdir: "/tmp/registry-check-{{ awx_job_id | default('local', true) }}"
  tasks:

    # There is no mirror registry in demo mode. Dialling out to a hostname that
    # does not resolve would hang the branch and take the demo with it.
    - name: DEMO - record the branch as simulated
      when: demo_mode | default(false) | bool
      block:
        - name: Publish simulated result
          ansible.builtin.set_stats:
            data:
              check_registry:
                status: SIMULATED
                hosts: "{{ mirror_hosts | default([], true) }}"
                detail: >-
                  Demo mode. In production this fetches /v2/ over TLS validated
                  by the bundle's own additionalTrustBundle, reads the
                  certificate the registry actually presents, and probes for the
                  release payload. A mirror that requires authentication returns
                  401, which leaves payload presence UNCONFIRMED rather than
                  verified.
        - name: End the play
          ansible.builtin.meta: end_play

    # A string here would be iterated character by character by the loop below,
    # and a mapping key by key. Assert the shape before anything consumes it.
    - name: Mirror hosts must be a non-empty list of scalars
      ansible.builtin.assert:
        that:
          - mirror_hosts is defined
          - mirror_hosts is not none
          - mirror_hosts is sequence
          - mirror_hosts is not string
          - mirror_hosts is not mapping
          - (mirror_hosts | length) > 0
          # Strings only. A number would be stringified by the parser and then
          # accepted by the hostname matcher, contradicting the documented form.
          - mirror_hosts | reject('string') | list | length == 0
        fail_msg: >-
          mirror_hosts must be a non-empty list of host strings, for example:
            mirror_hosts:
              - registry.example.com:8443
          It is derived from the bundle's imageContentSources, so an empty or
          malformed value means the bundle declares no usable mirror.
          Got: {{ mirror_hosts | default('undefined') }}

    # Parsing and validation live in tasks/mirror_host_parse.yml so the tests
    # exercise the same expressions. EVERY entry is validated, not just the
    # first: the /v2/ probe below loops over all of them, so a malformed second
    # host would otherwise reach the network as a nonsense URL. This runs before
    # any network module, and names the value and the accepted forms.
    - name: Reset the normalised endpoint list
      ansible.builtin.set_fact:
        _mirror_endpoints: []

    - name: Validate every mirror host and record its normalised endpoint
      ansible.builtin.include_tasks: tasks/mirror_host_validate.yml
      loop: "{{ mirror_hosts }}"
      loop_control:
        loop_var: _mh
        label: "{{ _mh }}"

    # Every probe below uses these, never the raw entry, so the certificate read
    # and the HTTP probes cannot target different spellings of one endpoint.
    - name: Bind the endpoint the certificate is read from
      ansible.builtin.set_fact:
        _mirror_authorities: "{{ _mirror_endpoints | map(attribute='authority') | list }}"
        _registry_hostname: "{{ _mirror_endpoints[0].hostname }}"
        _registry_port: "{{ _mirror_endpoints[0].port }}"
        _registry_authority: "{{ _mirror_endpoints[0].authority }}"

    - name: Create this job's scratch directory
      ansible.builtin.file:
        path: "{{ registry_workdir }}"
        state: directory
        mode: "0750"

    - name: Write the bundle's additionalTrustBundle to disk
      ansible.builtin.copy:
        content: "{{ trust_bundle }}"
        dest: "{{ registry_workdir }}/trust-bundle.pem"
        mode: "0644"

    - name: Registry /v2/ API must respond over TLS validated by that bundle
      ansible.builtin.uri:
        url: "https://{{ item }}/v2/"
        ca_path: "{{ registry_workdir }}/trust-bundle.pem"
        validate_certs: true
        status_code: [200, 401]   # 401 is fine - it means TLS and routing work
      loop: "{{ _mirror_authorities }}"
      register: _reg
      failed_when: false

    - name: Read the certificate the registry actually presents
      community.crypto.get_certificate:
        host: "{{ _registry_hostname }}"
        port: "{{ _registry_port }}"
      register: _cert
      failed_when: false

    # 404 on the tags/list endpoint means the release repository is not in the
    # mirror. The install would proceed as far as pulling the payload and then
    # stop, so it is treated as a failure.
    - name: Confirm the release payload for this version exists in the mirror
      ansible.builtin.uri:
        url: "https://{{ _registry_authority }}/v2/openshift/release-images/tags/list"
        ca_path: "{{ registry_workdir }}/trust-bundle.pem"
        status_code: [200, 401]
      register: _payload
      failed_when: false

    # Grading lives in tasks/registry_verdict.yml so the same expressions can be
    # exercised against fixture data by demo/tests/registry_verdict.yml.
    - name: Grade the probe results
      ansible.builtin.include_tasks: tasks/registry_verdict.yml
      vars:
        mirror_hosts: "{{ _mirror_authorities }}"

    - name: Publish result
      ansible.builtin.set_stats:
        data:
          check_registry:
            status: "{{ _registry_status }}"
            hosts: "{{ _mirror_authorities }}"
            unreachable: "{{ _unreachable_hosts }}"
            cert_host: "{{ _registry_authority }}"
            cert_expires: "{{ _cert.not_after | default('unknown') }}"
            cert_retrieved: "{{ _cert_ok }}"
            release_probe: "{{ _payload.status | default('n/a') }}"
            # CONFIRMED only on 200. UNCONFIRMED means the endpoint requires
            # authentication, so this run neither proved nor disproved that the
            # release payload is present.
            release_payload_state: "{{ _payload_state }}"
            detail: >-
              {{ 'Release payload confirmed present.' if _payload_state == 'CONFIRMED'
                 else ('Release payload presence UNCONFIRMED: the tag list requires
                        authentication, so this check did not verify release content.'
                       if _payload_state == 'UNCONFIRMED'
                       else 'Release payload not found in the mirror.') }}"

    - name: Fail on unreachable hosts, unreadable trust, or a missing payload
      ansible.builtin.fail:
        msg: >-
          {% if _unreachable_hosts | length > 0 %}
          {{ _unreachable_hosts | join(', ') }} did not answer on /v2/.
          If this is a certificate error, the CA in additionalTrustBundle does
          not match what the registry is presenting - the cluster will fail
          every image pull with x509 errors after install.
          {% endif %}
          {% if not _cert_ok %}
          No certificate could be read from {{ _registry_hostname }}:{{ _registry_port }}.
          The trust chain cannot be verified, so nothing here proves the cluster
          will accept what the registry presents.
          {% endif %}
          {% if _payload_state == 'MISSING' %}
          The release payload probe returned {{ _payload.status | default('no response') }}.
          The release repository is not in the mirror - oc-mirror did not publish
          it, or it was published under a different path.
          {% endif %}
      when: _registry_status == 'FAIL'
