---
# Before installation the VIPs must NOT answer. If an existing host already
# owns the API VIP, keepalived contends with it and the symptom appears later as
# intermittent API failures. This play asserts silence, not response.
- name: Assert VIP availability
  hosts: validators
  gather_facts: false
  tasks:

    - name: DEMO - record the branch as simulated
      when: demo_mode | default(false) | bool
      block:
        - name: Publish simulated result
          ansible.builtin.set_stats:
            data:
              check_vips:
                status: SIMULATED
                probed: "{{ (api_vips | default([])) + (ingress_vips | default([])) }}"
                detail: >-
                  Demo mode. In production each VIP is probed from the install
                  subnet and the check asserts silence - an address that already
                  answers is a VIP conflict waiting to happen.
        - name: End the play
          ansible.builtin.meta: end_play

    - name: Probe each VIP - we want silence
      ansible.builtin.command:
        cmd: "ping -c 2 -W 1 {{ item }}"
      loop: "{{ api_vips + ingress_vips }}"
      register: _ping
      changed_when: false
      failed_when: false

    - name: Publish result
      ansible.builtin.set_stats:
        data:
          check_vips:
            status: "{{ 'FAIL' if (_ping.results | selectattr('rc', 'eq', 0) | list | length > 0) else 'PASS' }}"
            probed: "{{ api_vips + ingress_vips }}"
            answering: "{{ _ping.results | selectattr('rc', 'eq', 0) | map(attribute='item') | list }}"

    - name: Assert nothing is already answering
      ansible.builtin.fail:
        msg: >-
          {{ _ping.results | selectattr('rc', 'eq', 0) | map(attribute='item')
          | join(', ') }} already in use. These VIPs must be free before
          install. Something on this segment owns that address - find it before
          keepalived does.
      when: _ping.results | selectattr('rc', 'eq', 0) | list | length > 0
