---
# Grade a mirror-registry probe into a readiness verdict.
#
# In its own file so demo/tests/registry_verdict.yml can grade the same
# expressions against fixture data.
#
# Inputs, set by the caller:
#   _reg              registered uri result, looped over mirror_hosts
#   _cert             registered get_certificate result
#   _payload          registered uri result for the release tags list
#   mirror_hosts      the configured hosts - normalised authorities in
#                     production, raw strings in the fixture tests - so results
#                     can be tied back to them
#
# Outputs:
#   _reg_results        the probe results, normalised to a list of mappings
#   _reg_hosts          the host each result names
#   _unreachable_hosts  hosts that did not answer on /v2/
#   _cert_ok            bool: a certificate was actually read
#   _payload_state      CONFIRMED | UNCONFIRMED | MISSING
#   _registry_status    PASS | UNCONFIRMED | FAIL
#   _registry_why       actionable reason when the status is not PASS
#
# HTTP statuses are compared as trimmed strings throughout. The uri module
# returns an integer, but a fixture or a future change can supply "200", and an
# int-vs-string comparison would silently grade it as MISSING. Normalising to a
# string never turns an absent or malformed status into a successful one:
# anything that is not exactly "200" or "401" is MISSING.

- name: Normalise the registry probe results
  ansible.builtin.set_fact:
    # default([], true) rather than default([]): an explicit null is defined,
    # so the plain form would not replace it and the filters below would raise.
    _reg_results: >-
      {{ (_reg_in if (_reg_in is sequence and _reg_in is not string
                      and _reg_in is not mapping) else [])
         | select('mapping') | list }}
    _reg_configured_raw: >-
      {{ (_cfg if (_cfg is sequence and _cfg is not string
                   and _cfg is not mapping) else []) | map('string') | list }}
    _unreachable_hosts: []
  vars:
    _reg_in: "{{ _reg.results | default([], true) }}"
    _cfg: "{{ mirror_hosts | default([], true) }}"

# A result that does not name the host it tested cannot be tied to a configured
# mirror, so it proves nothing about the environment even when its status is
# 200. Identity is required before reachability is graded.
#
# CANONICALISATION. Both sides go through the same transformation, so a
# configured " REGISTRY.EXAMPLE.COM:8443 " and a result "registry.example.com:8443"
# are recognised as the same endpoint:
#
#   * trim surrounding whitespace
#   * lowercase - DNS is case-insensitive and IPv6 hex is too; IPv4 and port
#     digits are unaffected, so one lowercase covers every supported form
#   * drop a single trailing root dot from the hostname, matching what
#     tasks/mirror_host_parse.yml accepts
#
# Ports are preserved, so two endpoints differing only by port stay different.
# Two spellings of the same IPv6 address - 2001:db8::1 and 2001:0db8:0000::1 -
# are NOT merged: reporting a mismatch is the conservative outcome, and merging
# would need a full address parse per result.
- name: Record the host each result names, canonicalised
  ansible.builtin.set_fact:
    _reg_hosts: "{{ _reg_results | map(attribute='item', default='') | map('string') | map('trim') | list }}"
    _reg_hosts_canon: >-
      {{ _reg_results | map(attribute='item', default='') | map('string')
         | map('trim') | map('lower') | map('regex_replace', '[.]$', '')
         | map('regex_replace', '[.]:', ':') | list }}
    _reg_configured: >-
      {{ _reg_configured_raw | map('trim') | map('lower')
         | map('regex_replace', '[.]$', '')
         | map('regex_replace', '[.]:', ':') | list }}

- name: Collect the hosts that did not answer on /v2/
  ansible.builtin.set_fact:
    _unreachable_hosts: "{{ _unreachable_hosts + [item.item | default('unnamed host')] }}"
  loop: "{{ _reg_results }}"
  loop_control:
    label: "{{ item.item | default('unnamed host') }}"
  when: (item.status | default('') | string | trim) not in ['200', '401']

- name: Derive the registry verdicts
  ansible.builtin.set_fact:
    # get_certificate runs with failed_when: false so its result reaches
    # set_stats. An absent not_after is the only reliable sign that no
    # certificate came back.
    _cert_ok: >-
      {{ _cert.not_after is defined and _cert.not_after is not none
         and (_cert.not_after | string | trim | length) > 0 }}
    # Every result must name a non-blank host.
    _reg_unnamed: "{{ _reg_hosts_canon | select('equalto', '') | list | length }}"
    # Results must correspond one-for-one with the configured mirrors: none
    # missing, none unknown, none duplicated.
    _reg_missing: "{{ _reg_configured | reject('in', _reg_hosts_canon) | list }}"
    _reg_unknown: "{{ _reg_hosts_canon | reject('equalto', '') | reject('in', _reg_configured) | list }}"
    _reg_duplicated: "{{ _reg_hosts_canon | length != (_reg_hosts_canon | unique | length) }}"
    # 200 is the only response that confirms the release repository exists.
    # 401 proves routing and TLS work and that the endpoint is there, but the
    # tag list is not enumerable without credentials, so payload existence is
    # neither confirmed nor disproved. Everything else - 404, a redirect, 403,
    # a missing status - means it is not published where the cluster will look.
    _payload_state: >-
      {{ 'CONFIRMED' if (_payload.status | default('') | string | trim) == '200'
         else ('UNCONFIRMED' if (_payload.status | default('') | string | trim) == '401'
               else 'MISSING') }}

# An empty result set means no mirror host was probed at all - an empty
# mirror_hosts, or a loop that never ran. Nothing was verified, so this cannot
# be PASS however healthy the certificate and payload probes look.
- name: Derive the overall registry status
  ansible.builtin.set_fact:
    _registry_status: >-
      {{ 'FAIL' if (_reg_results | length == 0
                    or (_reg_unnamed | int) > 0
                    or _reg_missing | length > 0
                    or _reg_unknown | length > 0
                    or _reg_duplicated | bool
                    or _unreachable_hosts | length > 0
                    or not (_cert_ok | bool)
                    or _payload_state == 'MISSING')
         else ('UNCONFIRMED' if _payload_state == 'UNCONFIRMED' else 'PASS') }}
    _registry_why: "{{ (_registry_reasons | select('truthy') | first) | default('ok', true) }}"
  vars:
    _registry_reasons:
      - >-
        {{ 'no registry host was probed - mirror_hosts is empty or the /v2/ check
            did not run' if _reg_results | length == 0 else '' }}
      - >-
        {{ (_reg_unnamed | int | string) ~ ' probe result(s) did not name the host
            tested, so they cannot be tied to a configured mirror'
           if (_reg_unnamed | int) > 0 else '' }}
      - >-
        {{ 'configured mirror(s) with no probe result: ' ~ (_reg_missing | join(', '))
           if _reg_missing | length > 0 else '' }}
      - >-
        {{ 'probe result(s) for host(s) not in mirror_hosts: ' ~ (_reg_unknown | join(', '))
           if _reg_unknown | length > 0 else '' }}
      - "{{ 'a mirror host was probed more than once' if _reg_duplicated | bool else '' }}"
      - >-
        {{ 'did not answer on /v2/: ' ~ (_unreachable_hosts | join(', '))
           if _unreachable_hosts | length > 0 else '' }}
      - "{{ 'no certificate could be read from the registry' if not (_cert_ok | bool) else '' }}"
      - "{{ 'release payload not found in the mirror' if _payload_state == 'MISSING' else '' }}"
      - >-
        {{ 'release payload presence could not be confirmed - the tag list requires
            authentication' if _payload_state == 'UNCONFIRMED' else '' }}
