---
# Dell-specific BIOS assertion, in its own file on purpose.
#
# include_tasks resolves at run time; a module referenced directly in a playbook
# resolves at parse time. Keeping the Dell module here lets the readiness
# workflow parse and run on an execution environment that does not carry
# dellemc.openmanage, while still using the certified module where it is
# available. That is why the collection is optional and undeclared.
#
# Reached only when bmc_vendor == 'dell'.
- name: Assert BIOS attributes on Dell hardware
  dellemc.openmanage.idrac_bios:
    idrac_ip: "{{ bmc_address }}"
    idrac_user: "{{ bmc_username }}"
    idrac_password: "{{ bmc_password }}"
    validate_certs: "{{ bmc_validate_certs }}"
    attributes:
      BootMode: Uefi
      SysProfile: PerfOptimized
      ProcVirtualization: Enabled
  check_mode: true       # readiness assessment: report drift, change nothing
  register: _bios
  failed_when: false
  no_log: true
