---
# Classify a Redfish read into a readiness verdict.
#
# In its own file so the same expressions can be exercised against fixture data
# by demo/tests/bmc_classification.yml. The playbook and the tests grade
# identically; there is no second copy of the logic to drift.
#
# Inputs, set by the caller:
#   _sys                registered result of GetSystemInventory
#   _fw                 registered result of GetFirmwareInventory
#   firmware_baseline   optional; may be undefined, null, or malformed
#
# Outputs:
#   _bmc_system         the selected system record, or {}
#   _bmc_reachable      bool
#   _bmc_unusable_why   why no usable record was found, for the report
#   _bmc_bios_installed installed BIOS version, or 'unknown'
#   _bmc_bios_expected  baseline version, or 'unset'
#   _bmc_firmware_state MATCH | DRIFT | UNKNOWN_INSTALLED | BASELINE_UNSET
#
# TYPE RULES, applied to every value that comes off the wire:
#
#   identifier   a non-blank string, or a number. Numeric zero IS accepted: a
#                Redfish Id of 0 names a system as well as any other, and
#                rejecting it would fail a working BMC. Booleans, lists,
#                mappings, null and blank strings are rejected - `false | string`
#                is "False", which is non-blank, so a string cast alone would
#                have accepted it.
#   PowerState   a string in the Redfish enumeration. Nothing else.
#   version      a non-blank string, or a number, normalised to a string.
#
# `is number` is true for booleans in Jinja, because bool subclasses int, so
# every numeric test below rejects booleans first.

- name: Establish the classification defaults
  ansible.builtin.set_fact:
    # Identifiers GetSystemInventory can return. Override bmc_identifier_keys
    # if a vendor exposes something else stable.
    _bmc_default_identifier_keys: ['Id', 'UUID', 'SerialNumber', 'ServiceTag', 'SKU']
    # Redfish PowerState enumeration. Override bmc_power_states for a vendor
    # that reports something outside it.
    _bmc_default_power_states: ['On', 'Off', 'PoweringOn', 'PoweringOff', 'Paused']
    _bmc_candidates: []
    _bmc_usable: []

# entries is documented as a list of (uri, record) pairs. Anything else is
# discarded here rather than crashing a filter downstream. `default([], true)`
# rather than `default([])`: an explicit null is defined, so the plain form
# would not replace it.
- name: Reduce the Redfish entries to well-formed pairs
  ansible.builtin.set_fact:
    _bmc_candidates: "{{ _bmc_candidates + [item | last] }}"
  loop: "{{ _bmc_entries_raw }}"
  loop_control:
    label: "{{ (item | last).Id | default('entry') if item is sequence and item is not string else 'malformed' }}"
  vars:
    _bmc_entries_in: "{{ _sys.redfish_facts.system.entries | default([], true) }}"
    # A string or mapping here would otherwise be iterated character- or
    # key-wise by the loop.
    _bmc_entries_raw: >-
      {{ _bmc_entries_in
         if (_bmc_entries_in is sequence and _bmc_entries_in is not string
             and _bmc_entries_in is not mapping)
         else [] }}
  when:
    - item is sequence
    - item is not string
    - item is not mapping
    # Exactly two elements: a one-element list holding a valid-looking record
    # is still not the documented shape.
    - (item | length) == 2
    - (item | last) is mapping

# A record is usable only if the downstream workflow could act on it, and that
# means VALUES of the right TYPE, not merely keys that exist. A Redfish error
# body is also a non-empty mapping and would otherwise read as a healthy
# system, so it is rejected explicitly.
- name: Keep only the records the workflow could act on
  ansible.builtin.set_fact:
    _bmc_usable: "{{ _bmc_usable + [item] }}"
  loop: "{{ _bmc_candidates }}"
  loop_control:
    label: "{{ item.Id | default(item.SerialNumber) | default('unidentified') }}"
  vars:
    _ids: >-
      {{ (bmc_identifier_keys | default(_bmc_default_identifier_keys))
         | select('in', item) | map('extract', item) | list }}
    _id_strings: "{{ _ids | select('string') | map('trim') | select('truthy') | list }}"
    _id_numbers: "{{ _ids | reject('boolean') | select('number') | list }}"
  when:
    - item.error is not defined
    - (_id_strings | length) + (_id_numbers | length) > 0
    - item.PowerState is defined
    - item.PowerState is string
    - (item.PowerState | trim) in (bmc_power_states | default(_bmc_default_power_states))

# First usable record wins, and the order the BMC returned them is preserved,
# so selection is deterministic across runs against the same hardware.
- name: Select the system record to report on
  ansible.builtin.set_fact:
    _bmc_system: "{{ _bmc_usable | first | default({}, true) }}"
    _bmc_reachable: "{{ _bmc_usable | length > 0 }}"
    _bmc_rejected: "{{ _bmc_candidates | reject('in', _bmc_usable) | list }}"

# Says what was wrong, not merely that something was.
- name: Record why no usable record was found
  ansible.builtin.set_fact:
    _bmc_unusable_why: "{{ 'ok' if _bmc_reachable | bool else _bmc_why_none }}"
  vars:
    _bmc_error_count: "{{ _bmc_rejected | selectattr('error', 'defined') | list | length }}"
    _bmc_why_none: >-
      {{ 'no usable system inventory returned' if _bmc_candidates | length == 0
         else 'of ' ~ _bmc_candidates | length ~ ' well-formed record(s): '
              ~ _bmc_error_count ~ ' Redfish error(s); the rest lacked a usable '
              ~ 'identifier (Id/UUID/SerialNumber/ServiceTag/SKU must be a '
              ~ 'non-blank string or a number) or a recognised PowerState ('
              ~ (bmc_power_states | default(_bmc_default_power_states) | join('/'))
              ~ ')' }}

# --- firmware ---------------------------------------------------------------

- name: Normalise the firmware baseline
  ansible.builtin.set_fact:
    _bmc_bios_expected: >-
      {{ (_b | trim) if (_b is string and (_b | trim | length) > 0)
         else ((_b | string) if (_b is not boolean and _b is number) else 'unset') }}
    _bmc_bios_entries: []
  vars:
    _fb: "{{ firmware_baseline | default({}, true) }}"
    # A baseline that is not a mapping has no bios_version to read.
    _b: "{{ (_fb.bios_version | default('')) if _fb is mapping else '' }}"

- name: Normalise the BIOS firmware records
  ansible.builtin.set_fact:
    _bmc_bios_entries: >-
      {{ _bmc_bios_entries
         + [{'id': (item.Id | default('', true) | string | trim | lower),
             'version': (item.Version | string | trim)}] }}
  loop: "{{ _bmc_fw_entries }}"
  loop_control:
    label: "{{ item.Id | default(item.Name) | default('bios') }}"
  vars:
    _fw_in: "{{ _fw.redfish_facts.firmware.entries | default([], true) }}"
    _bmc_fw_entries: >-
      {{ (_fw_in if (_fw_in is sequence and _fw_in is not string
                     and _fw_in is not mapping) else [])
         | select('mapping')
         | selectattr('Name', 'defined') | selectattr('Name', 'search', 'BIOS')
         | selectattr('Version', 'defined') | list }}
  # A version must be a non-blank string or a number. Booleans, lists and
  # mappings would stringify to "True", "[]" and "{}" and then compare.
  when:
    - item.Version is not boolean
    - (item.Version is string and (item.Version | trim | length) > 0)
      or (item.Version is number)

# Dell reports the running and the rollback image under the same Name, "BIOS",
# distinguished only by Id (Installed-159-2.15.1 vs Previous-159-2.14.0). Ids
# are trimmed and lowercased above, so padding and casing cannot smuggle a
# rollback image through. Records with no Id are kept: most BMCs report only
# the running image.
- name: Derive the installed BIOS version
  ansible.builtin.set_fact:
    _bmc_bios_installed: >-
      {{ (_bmc_bios_entries | rejectattr('id', 'match', '(previous|rollback|backup)')
          | map(attribute='version') | first)
         | default('unknown', true) }}

# An unknown installed version and an unset baseline are not "no drift". Both
# mean the comparison could not be made, and the report says which.
- name: Derive the firmware comparison state
  ansible.builtin.set_fact:
    _bmc_firmware_state: >-
      {{ 'UNKNOWN_INSTALLED' if _bmc_bios_installed == 'unknown'
         else ('BASELINE_UNSET' if _bmc_bios_expected == 'unset'
               else ('MATCH' if _bmc_bios_installed == _bmc_bios_expected else 'DRIFT')) }}
