---
# Parse and validate one mirror-registry host entry.
#
# PARSING AND VALIDATION ONLY. This file never fails the play: the caller
# decides what to do with _mirror_host_error. playbooks/12_validate_registry.yml
# fails unconditionally on a non-empty error, and the fixture tests inspect the
# string. That split is deliberate - an earlier version took a
# mirror_host_fail_on_error flag, which was an externally overridable variable
# and therefore a launch-time bypass of production validation.
#
# Input:
#   _mh   one entry from mirror_hosts
#
# Outputs:
#   _registry_hostname  the address, with IPv6 brackets removed
#   _registry_port      the port, or registry_port_default when none is given
#   _mirror_host_error  '' when valid, otherwise why it was rejected
#
# Accepted forms:
#   registry.example.com          10.42.10.5          2001:db8::1
#   registry.example.com:8443     10.42.10.5:5000     [2001:db8::1]
#   registry.example.com.         (one trailing         [2001:db8::1]:8443
#                                  root dot, normalised away)
#
# A single trailing root dot is accepted - it is a normal fully qualified DNS
# representation - and removed before the address is used or compared, so
# 'registry.example.com.' and 'registry.example.com' are one endpoint.
# 'registry.example.com..' and '.example.com' are rejected.
#
# DNS length limits are enforced: each label 1-63 characters, and the whole
# name at most 253.
#
# A bare IPv6 literal carries no port: splitting it on ':' would take its last
# hextet as one, so bracketing is required to give an IPv6 address a port.
#
# Address syntax is checked with ansible.utils.ipaddr, which the automation
# already depends on, rather than by counting characters: 'a:b:c' is all legal
# hex and colons and is not an address.
#
# Parsing uses string methods rather than regex substitution. Jinja applies
# Python escape processing to string literals, so a replacement written as '\1'
# becomes a control character and the substitution silently yields nothing.

- name: Parse the mirror host entry
  ansible.builtin.set_fact:
    _mh_raw: "{{ _mh | string | trim }}"

- name: Split the mirror host into address and port
  ansible.builtin.set_fact:
    _mh_bracketed: "{{ _mh_raw.startswith('[') }}"
    # Everything after the closing bracket, so trailing junk can be rejected
    # rather than silently ignored by the slice.
    _mh_after_bracket: "{{ _mh_raw.split(']', 1)[1] if ']' in _mh_raw else '' }}"
    # A single trailing root dot is stripped here so everything downstream -
    # the certificate endpoint, the published cert_host, and the identity
    # comparison in registry_verdict.yml - sees one canonical spelling.
    _registry_hostname: >-
      {{ (_mh_raw[1:_mh_raw.index(']')] if _mh_raw.startswith('[') and ']' in _mh_raw
          else (_mh_raw.split(':')[0] if _mh_raw.count(':') == 1 else _mh_raw))
         | regex_replace('[.]$', '') }}
    _registry_port: >-
      {{ _mh_raw.rsplit(':', 1)[1]
         if (_mh_raw.startswith('[') and ']:' in _mh_raw)
            or (not _mh_raw.startswith('[') and _mh_raw.count(':') == 1)
         else (registry_port | default(registry_port_default)) }}

# A first-match list rather than nested ternaries: the checks stay
# independently readable and the brackets stay countable.
- name: Validate the mirror host entry
  ansible.builtin.set_fact:
    _mirror_host_error: "{{ (_mh_checks | select('truthy') | first) | default('', true) }}"
  vars:
    _mh_has_scheme: "{{ '//' in _mh_raw or _mh_raw is search('^[A-Za-z][A-Za-z0-9+.-]*://') }}"
    _mh_brackets_ok: >-
      {{ _mh_raw.count('[') == _mh_raw.count(']')
         and ('[' not in _mh_raw or _mh_raw.startswith('['))
         and (not _mh_raw.startswith('[') or ']' in _mh_raw) }}
    # After the closing bracket only '' or ':port' is legal. '[::1]garbage',
    # '[::1]8443' and '[::1]/path' all land here.
    _mh_bracket_tail_ok: >-
      {{ (not _mh_raw.startswith('['))
         or _mh_after_bracket == ''
         or _mh_after_bracket.startswith(':') }}
    # Guarded: the filters raise on an undefined or empty value, and an empty
    # address is already reported by its own check above.
    _mh_addr: "{{ _registry_hostname | default('') }}"
    _mh_is_ipv6: "{{ ((_mh_addr | ansible.utils.ipv6) is truthy) if _mh_addr | length > 0 else false }}"
    _mh_is_ipv4: "{{ ((_mh_addr | ansible.utils.ipv4) is truthy) if _mh_addr | length > 0 else false }}"
    # A DNS name: labels of letters, digits and hyphens, separated by dots.
    # Leading and trailing hyphens are rejected; uppercase and all-numeric
    # labels are accepted. Lengths are checked separately because a regex
    # quantifier would have to be duplicated per label.
    _mh_labels: "{{ _mh_addr.split('.') if _mh_addr | length > 0 else [] }}"
    _mh_label_shape_ok: >-
      {{ _mh_labels | length > 0
         and (_mh_labels | select('match', '^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$')
              | list | length) == (_mh_labels | length) }}
    _mh_label_len_ok: >-
      {{ (_mh_labels | map('length') | select('>', 63) | list | length) == 0 }}
    _mh_is_hostname: >-
      {{ _mh_label_shape_ok | bool and _mh_label_len_ok | bool
         and (_mh_addr | length) <= 253 }}
    _mh_checks:
      - "{{ 'entry is empty' if _mh_raw | length == 0 else '' }}"
      - "{{ 'a URL scheme is not accepted - give host or host:port only' if _mh_has_scheme else '' }}"
      - "{{ 'a path, query or fragment is not accepted' if ('/' in _mh_raw or '?' in _mh_raw or '#' in _mh_raw) else '' }}"
      - "{{ 'unbalanced brackets' if not _mh_brackets_ok | bool else '' }}"
      - >-
        {{ 'trailing text after the bracketed address - only [addr] or
            [addr]:port is accepted' if not _mh_bracket_tail_ok | bool else '' }}
      - "{{ 'address is empty' if _registry_hostname | length == 0 else '' }}"
      # A bracketed address must be IPv6; brackets exist for nothing else.
      - >-
        {{ 'bracketed address is not a valid IPv6 address: ' ~ _registry_hostname
           if (_mh_raw.startswith('[') and not _mh_is_ipv6 | bool) else '' }}
      # Unbracketed with more than one colon can only be a bare IPv6 literal.
      - >-
        {{ 'not a valid IPv6 address - bracket it as [addr]:port to give it a port: '
           ~ _registry_hostname
           if (not _mh_raw.startswith('[') and _mh_raw.count(':') > 1
               and not _mh_is_ipv6 | bool) else '' }}
      # Otherwise it must be a hostname or an IPv4 address.
      - >-
        {{ 'a DNS label may not exceed 63 characters: ' ~ _registry_hostname
           if (not _mh_raw.startswith('[') and _mh_raw.count(':') <= 1
               and not (_mh_is_ipv4 | bool) and _mh_label_shape_ok | bool
               and not _mh_label_len_ok | bool) else '' }}
      - >-
        {{ 'a DNS name may not exceed 253 characters: ' ~ (_mh_addr | length)
           if (not _mh_raw.startswith('[') and _mh_raw.count(':') <= 1
               and not (_mh_is_ipv4 | bool) and _mh_label_shape_ok | bool
               and _mh_label_len_ok | bool and (_mh_addr | length) > 253) else '' }}
      - >-
        {{ 'not a hostname, IPv4 or IPv6 address: ' ~ _registry_hostname
           if (not _mh_raw.startswith('[') and _mh_raw.count(':') <= 1
               and not (_mh_is_ipv4 | bool or _mh_is_hostname | bool)) else '' }}
      - "{{ 'port is empty' if _mh_raw.endswith(':') else '' }}"
      - >-
        {{ 'port is not a number: ' ~ _registry_port
           if not (_registry_port | string).isdigit() else '' }}
      - >-
        {{ 'port out of range 1-65535: ' ~ _registry_port
           if ((_registry_port | string).isdigit()
               and ((_registry_port | int) < 1 or (_registry_port | int) > 65535)) else '' }}
