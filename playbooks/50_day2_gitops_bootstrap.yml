---
# AAP installs Argo CD, seeds the repository, and then gets out of the way.
# In-cluster desired state belongs to Argo from this point.
- name: Bootstrap GitOps on a new cluster
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: Approve any pending kubelet-serving CSRs
      ansible.builtin.command:
        cmd: oc get csr -o name
      register: _csrs
      changed_when: false

    - name: Approve
      ansible.builtin.command:
        cmd: "oc adm certificate approve {{ item | basename }}"
      loop: "{{ _csrs.stdout_lines }}"
      changed_when: true

    - name: Install the OpenShift GitOps operator from the mirrored catalog
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-gitops-operator
            namespace: openshift-operators
          spec:
            channel: latest
            name: openshift-gitops-operator
            source: cs-redhat-operator-index   # the mirrored CatalogSource
            sourceNamespace: openshift-marketplace

    - name: Wait for the Argo CD instance
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1beta1
        kind: ArgoCD
        namespace: openshift-gitops
      register: _argo
      until: _argo.resources | length > 0
      retries: 30
      delay: 20

    - name: Point Argo at the internal cluster-config repository
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: "cluster-config-{{ cluster_name }}"
            namespace: openshift-gitops
          spec:
            project: default
            source:
              repoURL: https://git.example.com/openshift/cluster-config.git
              targetRevision: "{{ site_id }}"
              path: overlays/{{ site_id }}
            destination:
              server: https://kubernetes.default.svc
            syncPolicy:
              automated: { prune: true, selfHeal: true }
