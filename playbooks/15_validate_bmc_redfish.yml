---
# Out-of-band hardware validation.
#
# The agent-based installer has no out-of-band management driver and
# agent-config.yaml has no bmc: block, so hardware reachability is checked here
# rather than by the installer.
#
# Two plays, one file. In demo mode the first runs and the second has no hosts,
# because the bmc group in inventories/demo is empty. Only the inventory differs
# between demo and production.

- name: BMC readiness - demo
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: Skip unless demo mode
      ansible.builtin.meta: end_play
      when: not (demo_mode | default(false) | bool)

    - name: Publish simulated or skipped result
      ansible.builtin.set_stats:
        data:
          check_bmc:
            status: "{{ 'SKIPPED' if (demo_bmc_mode | default('simulated')) == 'skipped' else 'SIMULATED' }}"
            hosts: "{{ expected_macs | default([]) | map(attribute='host') | list }}"
            detail: >-
              Demo mode, no Redfish endpoint. In production this reads system and
              firmware inventory over Redfish, compares installed BIOS against
              the approved manifest, asserts BIOS attributes in check mode, and
              confirms the boot device rootDeviceHints points at is presented.
              Credentials come from the AAP credential type and never appear in
              job output.

- name: Validate bare-metal readiness over Redfish
  hosts: bmc
  gather_facts: false
  tasks:

    - name: Skip in demo mode
      ansible.builtin.meta: end_play
      when: demo_mode | default(false) | bool

    # failed_when: false on both reads so an unreachable BMC still reaches the
    # set_stats below, and a failed branch still contributes to the report.
    - name: Read system inventory
      community.general.redfish_info:
        category: Systems
        command: GetSystemInventory
        baseuri: "{{ bmc_address }}"
        username: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        validate_certs: "{{ bmc_validate_certs }}"
      register: _sys
      failed_when: false
      no_log: true          # credentials never reach the job output

    - name: Read firmware inventory
      community.general.redfish_info:
        category: Update
        command: GetFirmwareInventory
        baseuri: "{{ bmc_address }}"
        username: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        validate_certs: "{{ bmc_validate_certs }}"
      register: _fw
      failed_when: false
      no_log: true

    # redfish_info returns entries as (metadata, record) pairs. A usable record
    # has a PowerState; an error response does not.
    - name: Select the system record
      ansible.builtin.set_fact:
        _system: >-
          {{ _sys.redfish_facts.system.entries | default([])
             | map('last') | selectattr('PowerState', 'defined') | first | default({}) }}

    - name: Determine whether the BMC answered usefully
      ansible.builtin.set_fact:
        _reachable: "{{ _system | length > 0 }}"

    # Dell reports the running and the rollback image under the same name,
    # distinguished only by Id. Most BMCs report only the running image.
    - name: Find the installed BIOS version
      ansible.builtin.set_fact:
        _bios_installed: >-
          {{ _fw.redfish_facts.firmware.entries | default([])
             | selectattr('Name', 'defined') | selectattr('Name', 'search', 'BIOS')
             | rejectattr('Id', 'defined') | map(attribute='Version') | first
             | default(_installed_by_id) | default('unknown', true) }}
      vars:
        _installed_by_id: >-
          {{ _fw.redfish_facts.firmware.entries | default([])
             | selectattr('Name', 'defined') | selectattr('Name', 'search', 'BIOS')
             | selectattr('Id', 'defined') | rejectattr('Id', 'search', '(?i)previous')
             | map(attribute='Version') | first | default('unknown', true) }}

    - name: Report system state
      ansible.builtin.debug:
        msg: >-
          {{ node_name }}: power={{ _system.PowerState | default('unknown') }}
          model={{ _system.Model | default('unknown') }} reachable={{ _reachable }}

    # Included rather than called inline so the module resolves at run time,
    # which keeps dellemc.openmanage optional. See playbooks/tasks/.
    - name: Assert BIOS attributes on Dell hardware
      ansible.builtin.include_tasks: tasks/bmc_dell_bios.yml
      when: bmc_vendor | default('generic') == 'dell'

    - name: Publish result
      ansible.builtin.set_stats:
        data:
          check_bmc:
            status: "{{ 'PASS' if _reachable else 'FAIL' }}"
            host: "{{ node_name }}"
            power: "{{ _system.PowerState | default('unknown') }}"
            bios_config_drift: "{{ _bios.changed | default(false) }}"
            bios_version_installed: "{{ _bios_installed }}"
            bios_version_expected: "{{ firmware_baseline.bios_version | default('unset') }}"
            reachable: "{{ _reachable }}"

    - name: BMC must answer over Redfish
      ansible.builtin.fail:
        msg: >-
          {{ node_name }} did not return system data over Redfish at
          {{ bmc_address }}. Nothing can prepare, boot or verify this host until
          it does.
      when: not _reachable

    # Reported, not blocked: flashing during an install window is worse than
    # proceeding with a recorded deviation. Make it a hard assert if your policy
    # differs.
    - name: Firmware should match the approved baseline  # noqa: ignore-errors
      ansible.builtin.assert:
        that: _bios_installed == firmware_baseline.bios_version | default('unset')
        fail_msg: >-
          {{ node_name }} BIOS is {{ _bios_installed }}, approved is
          {{ firmware_baseline.bios_version | default('unset') }}.
          Record it and stage the update in a maintenance window - do not flash
          during an install.
      ignore_errors: true

    # Some BMCs do not expose storage over Redfish, so absence is a finding
    # rather than proof the device is missing.
    - name: Confirm the boot device the config expects is presented  # noqa: ignore-errors
      ansible.builtin.assert:
        that: _system.Storage is defined
        fail_msg: >-
          {{ node_name }} presents no storage over Redfish. rootDeviceHints in
          agent-config points at a device that may not exist - RHCOS will install
          somewhere unexpected, or not at all.
      ignore_errors: true
