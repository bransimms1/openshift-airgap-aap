---
# Out-of-band hardware validation. agent-config.yaml has no bmc: block and the
# agent-based installer has no out-of-band management driver, so hardware
# reachability has to be validated outside the installer.
#
# Two plays, one file. In demo mode the first runs and the second has no hosts
# (the bmc group in inventories/demo is deliberately empty). In production the
# first ends immediately and the second does the real work. The tasks that
# matter do not change; only the inventory does.

- name: BMC readiness - demo
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:

    - name: Skip unless demo mode
      ansible.builtin.meta: end_play
      when: not (demo_mode | default(false) | bool)

    # No Redfish endpoint exists and no credential is attached. Nothing here
    # dials out. The branch reports what it is rather than inventing a result.
    - name: Publish simulated or skipped result
      ansible.builtin.set_stats:
        data:
          check_bmc:
            status: "{{ 'SKIPPED' if (demo_bmc_mode | default('simulated')) == 'skipped' else 'SIMULATED' }}"
            hosts: "{{ (expected_macs | default([], true)) | map(attribute='host') | list }}"
            detail: >-
              Demo mode, no Redfish endpoint. In production this reads system
              and firmware inventory over Redfish, compares installed BIOS
              against the approved manifest, asserts BIOS attributes in check
              mode, and confirms the boot device rootDeviceHints points at is
              actually presented. Credentials come from the AAP custom
              credential type and never appear in job output.

- name: Validate bare-metal readiness over Redfish
  hosts: bmc
  gather_facts: false
  tasks:

    - name: Skip in demo mode
      ansible.builtin.meta: end_play
      when: demo_mode | default(false) | bool

    - name: Read system inventory
      community.general.redfish_info:
        category: Systems
        command: GetSystemInventory
        baseuri: "{{ bmc_address }}"
        username: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        validate_certs: "{{ bmc_validate_certs }}"
      register: _sys
      failed_when: false
      no_log: true          # credentials never reach the job output

    - name: Read firmware inventory
      community.general.redfish_info:
        category: Update
        command: GetFirmwareInventory
        baseuri: "{{ bmc_address }}"
        username: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        validate_certs: "{{ bmc_validate_certs }}"
      register: _fw
      failed_when: false
      no_log: true

    # Classification lives in tasks/bmc_classify.yml so the same expressions can
    # be graded against fixture data by demo/tests/bmc_classification.yml.
    - name: Classify the Redfish read
      ansible.builtin.include_tasks: tasks/bmc_classify.yml

    - name: Report system state
      ansible.builtin.debug:
        msg: >-
          {{ node_name }}: power={{ _bmc_system.PowerState | default('unknown') }}
          model={{ _bmc_system.Model | default('unknown') }}
          reachable={{ _bmc_reachable }}

    # --- Dell-specific: certified collection, richer than generic Redfish ----
    # Included rather than called inline so the module is resolved at runtime.
    # A direct reference is resolved at parse time and would fail the whole job
    # in an EE without dellemc.openmanage, even though the task is skipped.
    - name: Assert BIOS attributes on Dell hardware
      ansible.builtin.include_tasks: tasks/bmc_dell_bios.yml
      when: bmc_vendor | default('generic') == 'dell'

    # Published before any assertion below, so a failed BMC branch still
    # contributes detail to the readiness report.
    - name: Publish result
      ansible.builtin.set_stats:
        data:
          check_bmc:
            status: "{{ 'PASS' if _bmc_reachable else 'FAIL' }}"
            host: "{{ node_name }}"
            power: "{{ _bmc_system.PowerState | default('unknown') }}"
            # Dell BIOS ATTRIBUTE drift from tasks/bmc_dell_bios.yml. This is
            # distinct from firmware version drift, published below.
            bios_drift: "{{ _bios.changed | default(false) }}"
            # Firmware comparison is advisory and never blocks BMC readiness.
            # firmware_state is the truthful field: it distinguishes a genuine
            # match from a comparison that could not be made. firmware_drift is
            # retained for consumers that already read it, and is true only for
            # a confirmed DRIFT.
            firmware_state: "{{ _bmc_firmware_state }}"
            firmware_drift: "{{ _bmc_firmware_state == 'DRIFT' }}"
            bios_version_installed: "{{ _bmc_bios_installed }}"
            bios_version_expected: "{{ _bmc_bios_expected }}"
            reachable: "{{ _bmc_reachable }}"
            detail: "{{ _bmc_unusable_why }}"

    - name: BMC must return usable system data over Redfish
      ansible.builtin.fail:
        msg: >-
          {{ node_name }} did not return usable system data over Redfish at
          {{ bmc_address }}: {{ _bmc_unusable_why }}.
          A usable record needs an identifier and a PowerState, and must not be
          a Redfish error body. Nothing can prepare, boot or verify this host
          until it does.
      when: not _bmc_reachable

    # Firmware drift is reported, not blocked: flashing during an install window
    # is worse than proceeding with a known, recorded deviation. The finding is
    # published above; this assertion surfaces it in the job output.
    - name: Firmware must match the approved baseline  # noqa: ignore-errors
      ansible.builtin.assert:
        that: _bmc_firmware_state in ['MATCH', 'UNKNOWN_INSTALLED', 'BASELINE_UNSET']
        fail_msg: >-
          {{ node_name }} BIOS drift. Approved {{ _bmc_bios_expected }},
          installed {{ _bmc_bios_installed }}.
          Report it, stage the update in a window - do not flash during an install.
      ignore_errors: true   # drift is a finding, not necessarily a blocker

    # Some BMCs do not expose storage over Redfish at all. Absence of the
    # inventory is a finding worth recording, not proof the device is missing.
    - name: Confirm the boot device the config expects is actually presented  # noqa: ignore-errors
      ansible.builtin.assert:
        that: _bmc_system.Storage is defined
        fail_msg: >-
          {{ node_name }} presents no storage over Redfish. rootDeviceHints in
          agent-config points at a device that may not exist - RHCOS will
          install somewhere unexpected or not at all.
      ignore_errors: true
