---
name: CI

# Three ansible-core versions: the minimum supported, the version matching the
# AAP 2.6 execution environment, and the current release as an early warning.
# Lint tools are pinned so a tool release cannot change results on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ANSIBLE_CORE_PRIMARY: "2.16.14"   # matches the AAP 2.6 execution environment
  ANSIBLE_LINT_VERSION: "6.22.2"
  YAMLLINT_VERSION: "1.35.1"
  AWX_AWX_VERSION: "24.6.1"
  GITLEAKS_VERSION: "8.28.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install pinned tooling
        run: |
          pip install \
            "ansible-core==${ANSIBLE_CORE_PRIMARY}" \
            "ansible-lint==${ANSIBLE_LINT_VERSION}" \
            "yamllint==${YAMLLINT_VERSION}"

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  syntax:
    name: Syntax check (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.15.13", "2.16.14", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install ansible-core ${{ matrix.ansible }}
        run: |
          if [ "${{ matrix.ansible }}" = "latest" ]; then
            pip install ansible-core
          else
            pip install "ansible-core==${{ matrix.ansible }}"
          fi
          pip install jmespath dnspython netaddr
          ansible --version | head -1

      # Public Galaxy content only. ansible.controller is Automation Hub content
      # that no playbook under playbooks/ or roles/ imports.
      - name: Install collections
        run: ansible-galaxy collection install -r execution-environment/requirements.yml

      - name: Syntax-check every playbook
        run: |
          for pb in playbooks/*.yml; do
            echo "== $pb"
            ansible-playbook --syntax-check -i inventories/site-a/hosts.yml "$pb"
          done

      # controller/*.yml import ansible.controller, which a public runner cannot
      # install. awx.awx carries the same module names, so substituting the
      # namespace into throwaway copies confirms the files parse. It does not
      # confirm the certified collection accepts these parameters - that check
      # lives in controller-validate.yml and needs a Hub token.
      - name: Controller syntax smoke test (awx.awx namespace)
        run: |
          ansible-galaxy collection install "awx.awx:==${AWX_AWX_VERSION}"
          mkdir -p /tmp/ctl && cp -r controller/surveys /tmp/ctl/
          for f in controller/*.yml controller/credential_types/*.yml; do
            [ "$(basename "$f")" = "requirements.yml" ] && continue
            rel="${f#controller/}"
            mkdir -p "/tmp/ctl/$(dirname "$rel")"
            sed 's/ansible\.controller\./awx.awx./g' "$f" > "/tmp/ctl/$rel"
            echo "== $f"
            ansible-playbook --syntax-check "/tmp/ctl/$rel"
          done

  demo:
    name: Demo scenarios (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.15.13", "2.16.14", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install ansible-core ${{ matrix.ansible }}
        run: |
          if [ "${{ matrix.ansible }}" = "latest" ]; then
            pip install ansible-core
          else
            pip install "ansible-core==${{ matrix.ansible }}"
          fi
          pip install jmespath dnspython netaddr
          ansible --version | head -1

      - name: Install collections
        run: ansible-galaxy collection install -r execution-environment/requirements.yml

      # Each node runs in its own process with its own filesystem root, carrying
      # artifacts forward the way Automation Controller does on OpenShift. A
      # node that depends on a sibling's files fails here.
      - name: Passing scenario reaches the approval gate
        run: |
          out=$(demo/node-isolation-test.sh passing)
          echo "$out"
          echo "$out" | grep -q "All nodes succeeded independently" \
            || { echo "::error::a node failed"; exit 1; }
          echo "$out" | grep -q "READY_WITH_LIMITATIONS" \
            || { echo "::error::expected READY_WITH_LIMITATIONS"; exit 1; }

      - name: Failing DNS scenario blocks the gate
        run: |
          out=$(demo/node-isolation-test.sh failing_dns || true)
          echo "$out"
          echo "$out" | grep -q "NOT_READY" \
            || { echo "::error::expected NOT_READY"; exit 1; }
          echo "$out" | grep -q "Nodes that failed: 10_validate_dns 20_readiness_report" \
            || { echo "::error::DNS and the report should both fail, making the gate unreachable"; exit 1; }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0    # gitleaks scans history, not just the tip

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Literal credentials in credential-shaped keys
        run: python3 .github/scripts/secret_scan.py

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Exported from HEAD rather than scanned in place: `gitleaks dir .` walks
      # everything on disk, including installed collections.
      - name: Gitleaks - tracked tree
        run: |
          mkdir -p /tmp/export
          git archive HEAD | tar -x -C /tmp/export
          gitleaks dir /tmp/export --config .gitleaks.toml --no-banner

      - name: Gitleaks - full history
        run: gitleaks git . --config .gitleaks.toml --log-opts="--all" --no-banner
