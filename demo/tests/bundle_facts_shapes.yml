---
# Malformed install-config shapes must produce a controlled schema failure, not
# an undefined-variable traceback.
#
#   ansible-playbook -i localhost, demo/tests/bundle_facts_shapes.yml
- name: Bundle fact normalisation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _valid_isc: {apiVersion: "mirror.openshift.io/v2alpha1"}
    # Valid fragments, referenced by the cases below so no line has to carry a
    # whole install-config inline.
    _vp: &vp
      baremetal:
        apiVIPs: ["10.42.10.5"]
        ingressVIPs: ["10.42.10.6"]
    _vn: &vn
      machineNetwork:
        - cidr: "10.42.10.0/24"
    _vmeta: &vmeta {name: c}
    cases:
      # --- shapes that MUST be accepted --------------------------------------
      - name: "valid IPv4 bundle"
        expect: accept
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: *vn}
      - name: "valid IPv6 machine network"
        expect: accept
        ic:
          metadata: {name: c}
          baseDomain: e.com
          platform: {baremetal: {apiVIPs: ["2001:db8::5"], ingressVIPs: ["2001:db8::6"]}}
          networking: {machineNetwork: [{cidr: "2001:db8::/64"}]}
      - name: "agent-config absent is fine"
        expect: accept
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: *vn}

      # --- document roots ----------------------------------------------------
      - {name: "ic is null", ic: null}
      - {name: "ic is a sequence", ic: [not, a, mapping]}
      - {name: "ic is a string", ic: "install-config"}
      - {name: "isc is null", ic: {metadata: {name: c}, baseDomain: e.com}, isc: null}
      - {name: "isc is a sequence", ic: {metadata: {name: c}, baseDomain: e.com}, isc: [a]}
      # --- cluster identity --------------------------------------------------
      - name: "metadata is null"
        ic: {metadata: null, baseDomain: e.com, platform: *vp, networking: *vn}
      - name: "metadata is a sequence"
        ic: {metadata: [], baseDomain: e.com, platform: *vp, networking: *vn}
      - name: "metadata is absent"
        ic: {baseDomain: e.com, platform: *vp, networking: *vn}
      - name: "metadata.name is absent"
        ic: {metadata: {}, baseDomain: e.com, platform: *vp, networking: *vn}
      - name: "metadata.name is blank"
        ic: {metadata: {name: "   "}, baseDomain: e.com, platform: *vp, networking: *vn}
      - name: "baseDomain is null"
        ic: {metadata: *vmeta, baseDomain: null, platform: *vp, networking: *vn}
      - name: "baseDomain is blank"
        ic: {metadata: *vmeta, baseDomain: "  ", platform: *vp, networking: *vn}
      # --- machineNetwork shape ----------------------------------------------
      - name: "machineNetwork is a string"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: "10.42.10.0/24"}}
      - name: "machineNetwork is a mapping"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: {cidr: "10.42.10.0/24"}}}
      - name: "machineNetwork contains a bare string"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: ["not-a-mapping"]}}
      - name: "machineNetwork contains null"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: [null]}}
      - name: "machineNetwork entry has no cidr"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: [{prefix: 24}]}}
      - name: "cidr is null"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: [{cidr: null}]}}
      - name: "cidr is blank"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: [{cidr: "  "}]}}
      - name: "cidr is not a valid network"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: *vp, networking: {machineNetwork: [{cidr: "not-a-cidr"}]}}
      - name: "platform.baremetal is null"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: {baremetal: null}}
      - name: "platform is null"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: null}
      - name: "platform.baremetal is a list"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: {baremetal: []}}
      - name: "platform.baremetal is a string"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: {baremetal: "invalid"}}
      - name: "platform is absent entirely"
        ic: {metadata: *vmeta, baseDomain: e.com}
      - name: "baremetal present but VIPs missing"
        ic: {metadata: *vmeta, baseDomain: e.com, platform: {baremetal: {}}}
      - name: "networking is null"
        ic:
          metadata: {name: c}
          baseDomain: e.com
          platform: {baremetal: {apiVIPs: ["10.0.0.1"], ingressVIPs: ["10.0.0.2"]}}
          networking: null
  tasks:

    - name: Every malformed shape must fail the schema assertion, not raise
      ansible.builtin.include_tasks: bundle_shape_case.yml
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    # The accumulator must survive starting from an explicit null.
    - name: A null _bundle_yaml accumulator still accepts a parsed document
      ansible.builtin.set_fact:
        _bundle_yaml: null

    - name: Combine into the null accumulator
      ansible.builtin.set_fact:
        _bundle_yaml: >-
          {{ _bundle_yaml | default({}, true)
             | combine({item.item: (item.content | b64decode | from_yaml)}) }}
      loop:
        - {item: "install-config.yaml", content: "YmFzZURvbWFpbjogZS5jb20K"}
      loop_control:
        label: "{{ item.item }}"

    - name: The document was added
      ansible.builtin.assert:
        that:
          - _bundle_yaml is mapping
          - _bundle_yaml['install-config.yaml'].baseDomain == 'e.com'
        success_msg: "ok: a null accumulator was replaced and the document parsed"

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ cases | length }} bundle shapes graded
          ({{ cases | selectattr("expect", "defined") | list | length }} accepted,
          {{ cases | rejectattr("expect", "defined") | list | length }} rejected),
          plus the null accumulator.
