---
# Fixture-driven tests for playbooks/tasks/registry_verdict.yml.
#
#   ansible-playbook -i localhost, demo/tests/registry_verdict.yml
- name: Registry verdict
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same default the playbook uses when a mirror host carries no port.
    registry_port_default: 8443
    cases:
      - name: everything verified
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: authenticated mirror - payload unconfirmed, not PASS
        reg: {results: [{status: 401, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 401}
        cert_ok: true
        payload_state: UNCONFIRMED
        status: UNCONFIRMED

      - name: release repository missing (404)
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 404}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: payload probe did not run at all
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {failed: true}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: certificate could not be read
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {failed: true, msg: "handshake failure"}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: certificate present but empty not_after
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: ""}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: a host did not answer on /v2/
        reg: {results: [{status: 200, item: "a.example.com:8443"}, {status: -1, item: "b.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        unreachable: ["b.example.com:8443"]
        status: FAIL

      - name: unreachable host outranks an unconfirmed payload
        reg: {results: [{status: 503, item: "a.example.com:443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 401}
        cert_ok: true
        payload_state: UNCONFIRMED
        unreachable: ["a.example.com:443"]
        status: FAIL
  tasks:

    - name: Grade every fixture through the shipped rules
      ansible.builtin.include_tasks: registry_case.yml
      vars:
        _reg: "{{ case.reg }}"
        _cert: "{{ case.cert }}"
        _payload: "{{ case.payload }}"
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Verify mirror-host address and port parsing
      vars:
        _mh: "{{ item.host }}"
        _host: >-
          {{ _mh[1:_mh.index(']')] if _mh.startswith('[')
             else (_mh.split(':')[0] if _mh.count(':') == 1 else _mh) }}
        _port: >-
          {{ _mh.rsplit(':', 1)[1]
             if (_mh.startswith('[') and ']:' in _mh)
                or (not _mh.startswith('[') and _mh.count(':') == 1)
             else (registry_port | default(registry_port_default)) }}
      ansible.builtin.assert:
        that:
          - _host == item.hostname
          - _port | string == item.port
        success_msg: "ok: {{ item.host }} -> {{ _host }} port {{ _port }}"
        fail_msg: "FAILED: {{ item.host }} -> {{ _host }} port {{ _port }}, wanted {{ item.hostname }}:{{ item.port }}"
      loop:
        - host: "registry.example.com:443"
          hostname: "registry.example.com"
          port: "443"
        - host: "registry.example.com:8443"
          hostname: "registry.example.com"
          port: "8443"
        - host: "registry.example.com:5000"
          hostname: "registry.example.com"
          port: "5000"
        - host: "registry.example.com"
          hostname: "registry.example.com"
          port: "8443"
        - host: "10.42.10.5:5000"
          hostname: "10.42.10.5"
          port: "5000"
        - host: "10.42.10.5"
          hostname: "10.42.10.5"
          port: "8443"
        # Bracketed IPv6, with and without a port.
        - host: "[2001:db8::1]:8443"
          hostname: "2001:db8::1"
          port: "8443"
        - host: "[2001:db8::1]"
          hostname: "2001:db8::1"
          port: "8443"
        # A bare IPv6 literal carries no port; its last hextet must not be
        # mistaken for one.
        - host: "2001:db8::1"
          hostname: "2001:db8::1"
          port: "8443"
      loop_control:
        label: "{{ item.host }}"

    - name: Report the number of cases graded
      ansible.builtin.debug:
        msg: "{{ cases | length }} registry verdict cases passed, plus 9 address-parsing cases."
