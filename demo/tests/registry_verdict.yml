---
# Fixture-driven tests for playbooks/tasks/registry_verdict.yml.
#
#   ansible-playbook -i localhost, demo/tests/registry_verdict.yml
- name: Registry verdict
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same default the playbook uses when a mirror host carries no port.
    registry_port_default: 8443
    _label63: "{{ 'a' * 63 }}"
    _label64: "{{ 'a' * 64 }}"
    _name253: "{{ (['a' * 49] * 5) | join('.') ~ '.abc' }}"
    _name254: "{{ (['a' * 49] * 5) | join('.') ~ '.abcd' }}"
    addresses:
      # --- accepted ---------------------------------------------------------
      - {host: "registry.example.com", hostname: "registry.example.com", port: "8443", error: ""}
      - {host: "registry.example.com:8443", hostname: "registry.example.com", port: "8443", error: ""}
      - {host: "registry.example.com:443", hostname: "registry.example.com", port: "443", error: ""}
      - {host: "registry.example.com:5000", hostname: "registry.example.com", port: "5000", error: ""}
      - {host: "10.42.10.5", hostname: "10.42.10.5", port: "8443", error: ""}
      - {host: "10.42.10.5:5000", hostname: "10.42.10.5", port: "5000", error: ""}
      - {host: "[2001:db8::1]", hostname: "2001:db8::1", port: "8443", error: ""}
      - {host: "[2001:db8::1]:8443", hostname: "2001:db8::1", port: "8443", error: ""}
      - {host: "2001:db8::1", hostname: "2001:db8::1", port: "8443", error: ""}
      - {host: "registry.example.com:65535", hostname: "registry.example.com", port: "65535", error: ""}
      # --- IPv6 syntax, validated with ansible.utils.ipaddr ------------------
      - {host: "::1", hostname: "::1", port: "8443", error: ""}
      - {host: "[::1]", hostname: "::1", port: "8443", error: ""}
      - {host: "[::1]:8443", hostname: "::1", port: "8443", error: ""}
      - {host: "2001:db8:0:0:0:0:0:1", hostname: "2001:db8:0:0:0:0:0:1", port: "8443", error: ""}
      - {host: "a:b:c", error_contains: "not a valid IPv6"}
      - {host: "2001:::1", error_contains: "not a valid IPv6"}
      - {host: "12345::1", error_contains: "not a valid IPv6"}
      - {host: "gggg::1", error_contains: "not a valid IPv6"}
      - {host: "1:2:3:4:5:6:7", error_contains: "not a valid IPv6"}
      - {host: "1:2:3:4:5:6:7:8:9", error_contains: "not a valid IPv6"}
      # --- trailing text after a bracketed address ---------------------------
      - {host: "[::1]garbage", error_contains: "trailing text"}
      - {host: "[::1]8443", error_contains: "trailing text"}
      - {host: "[::1]:8443extra", error_contains: "port is not a number"}
      - {host: "[::1]/path", error_contains: "path"}
      - {host: "[::1]?query", error_contains: "path, query or fragment"}
      - {host: "[::1]#fragment", error_contains: "path, query or fragment"}
      - {host: "[2001:db8::1]notaport", error_contains: "trailing text"}
      # --- trailing root dot -------------------------------------------------
      - {host: "registry.example.com.", hostname: "registry.example.com", port: "8443", error: ""}
      # A trailing dot on an IP literal is DNS notation applied to something
      # that is not a DNS name - deliberately rejected, not normalised.
      - {host: "10.42.10.5.", error_contains: "trailing dot is DNS notation"}
      - {host: "[::1].", error_contains: "trailing text"}
      - {host: "REGISTRY.EXAMPLE.COM.", hostname: "REGISTRY.EXAMPLE.COM", port: "8443", error: ""}
      - {host: "registry.example.com.:8443", hostname: "registry.example.com", port: "8443", error: ""}
      - {host: "registry.example.com..", error_contains: "not a hostname"}
      - {host: ".example.com", error_contains: "not a hostname"}
      # --- DNS length limits -------------------------------------------------
      # Long names are built here rather than written out, to keep the file
      # inside the line-length limit. 63 is the maximum DNS label; 253 the
      # maximum name.
      - host: "{{ _label63 }}.example.com"
        hostname: "{{ _label63 }}.example.com"
        port: "8443"
        error: ""
      - host: "{{ _label64 }}.example.com"
        error_contains: "63 characters"
      - host: "{{ _name253 }}"
        hostname: "{{ _name253 }}"
        port: "8443"
        error: ""
      - host: "{{ _name254 }}"
        error_contains: "253 characters"
      - {host: "REGISTRY.EXAMPLE.COM:8443", hostname: "REGISTRY.EXAMPLE.COM", port: "8443", error: ""}
      - {host: "12345.example.com", hostname: "12345.example.com", port: "8443", error: ""}
      - {host: "-bad.example.com", error_contains: "not a hostname"}
      - {host: "bad-.example.com", error_contains: "not a hostname"}
      # --- rejected ---------------------------------------------------------
      - {host: "registry.example.com:", error_contains: "port is empty"}
      - {host: "registry.example.com:notaport", error_contains: "not a number"}
      - {host: "[2001:db8::1", error_contains: "brackets"}
      - {host: "[2001:db8::1]:", error_contains: "port is empty"}
      - {host: "https://registry.example.com:8443", error_contains: "scheme"}
      - {host: "registry.example.com:8443/path", error_contains: "path"}
      - {host: "", error_contains: "empty"}
      - {host: "registry.example.com:0", error_contains: "out of range"}
      - {host: "registry.example.com:70000", error_contains: "out of range"}
      - {host: "registry.example.com:8443:extra", error_contains: "not a valid IPv6"}
    cases:
      # --- host identity canonicalisation ------------------------------------
      - name: configured host with surrounding whitespace still matches
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["  registry.example.com:8443  "]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: result host with surrounding whitespace still matches
        reg: {results: [{status: 200, item: " registry.example.com:8443 "}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: uppercase configured DNS hostname still matches
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["REGISTRY.EXAMPLE.COM:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: uppercase result DNS hostname still matches
        reg: {results: [{status: 200, item: "REGISTRY.EXAMPLE.COM:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: trailing root dot is normalised away on both sides
        reg: {results: [{status: 200, item: "registry.example.com.:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: matching IPv4 host and port
        reg: {results: [{status: 200, item: "10.42.10.5:5000"}]}
        hosts: ["10.42.10.5:5000"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: matching bracketed IPv6 and port, case-insensitively
        reg: {results: [{status: 200, item: "[2001:DB8::1]:8443"}]}
        hosts: ["[2001:db8::1]:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: genuinely different ports must not merge
        reg: {results: [{status: 200, item: "registry.example.com:5000"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: genuinely different hosts must not merge
        reg: {results: [{status: 200, item: "other.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      # --- null-safety and host identity ------------------------------------
      - name: "null registry results cannot pass"
        reg: {results: null}
        hosts: []
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: a 200 result with no item cannot pass
        reg: {results: [{status: 200}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: a blank item cannot pass
        reg: {results: [{status: 200, item: "   "}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: a null item cannot pass
        reg: {results: [{status: 200, item: null}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: duplicate results for one host cannot pass
        reg: {results: [{status: 200, item: "r:8443"}, {status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: a configured host missing from the results cannot pass
        reg: {results: [{status: 200, item: "a:8443"}]}
        hosts: ["a:8443", "b:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: an unknown host in the results cannot pass
        reg: {results: [{status: 200, item: "a:8443"}, {status: 200, item: "rogue:8443"}]}
        hosts: ["a:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: exact matching results for every configured host passes
        reg: {results: [{status: 200, item: "a:8443"}, {status: 401, item: "b:8443"}]}
        hosts: ["a:8443", "b:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      # --- input hardening --------------------------------------------------
      - name: empty registry results cannot pass - nothing was probed
        reg: {results: []}
        hosts: []
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: missing registry results cannot pass
        reg: {}
        hosts: []
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: string status "200" is normalised to CONFIRMED
        reg: {results: [{status: "200", item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: "200"}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: string status "401" is normalised to UNCONFIRMED
        reg: {results: [{status: "401", item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: "401"}
        cert_ok: true
        payload_state: UNCONFIRMED
        status: UNCONFIRMED

      - name: redirect 301 is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 301}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: redirect 302 is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 302}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: redirect 307 is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 307}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: 403 is MISSING - forbidden is not authentication required
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 403}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: missing payload status is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: malformed payload status string is MISSING
        reg: {results: [{status: "notaport", item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: "two hundred"}
        cert_ok: true
        payload_state: MISSING
        unreachable: ["r:8443"]
        status: FAIL

      - name: null payload status is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: null}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: null not_after is not a usable certificate
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: null}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: whitespace-only not_after is not a usable certificate
        reg: {results: [{status: 200, item: "r:8443"}]}
        hosts: ["r:8443"]
        cert: {not_after: "   "}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: everything verified
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: authenticated mirror - payload unconfirmed, not PASS
        reg: {results: [{status: 401, item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 401}
        cert_ok: true
        payload_state: UNCONFIRMED
        status: UNCONFIRMED

      - name: release repository missing (404)
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 404}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: payload probe did not run at all
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {failed: true}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: certificate could not be read
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {failed: true, msg: "handshake failure"}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: certificate present but empty not_after
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        hosts: ["registry.example.com:8443"]
        cert: {not_after: ""}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: a host did not answer on /v2/
        reg: {results: [{status: 200, item: "a.example.com:8443"}, {status: -1, item: "b.example.com:8443"}]}
        hosts: ["a.example.com:8443", "b.example.com:8443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        unreachable: ["b.example.com:8443"]
        status: FAIL

      - name: unreachable host outranks an unconfirmed payload
        reg: {results: [{status: 503, item: "a.example.com:443"}]}
        hosts: ["a.example.com:443"]
        cert: {not_after: "20270101000000Z"}
        payload: {status: 401}
        cert_ok: true
        payload_state: UNCONFIRMED
        unreachable: ["a.example.com:443"]
        status: FAIL
  tasks:

    - name: Grade every fixture through the shipped rules
      ansible.builtin.include_tasks: registry_case.yml
      vars:
        _reg: "{{ case.reg }}"
        _cert: "{{ case.cert }}"
        _payload: "{{ case.payload }}"
        mirror_hosts: "{{ case.hosts | default([]) }}"
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Verify mirror-host parsing and validation
      ansible.builtin.include_tasks: mirror_host_case.yml
      vars:
        _mh: "{{ addr.host }}"
      loop: "{{ addresses }}"
      loop_control:
        loop_var: addr
        label: "{{ addr.host | default('(empty)') }}"

    - name: Report the number of cases graded
      ansible.builtin.debug:
        msg: "{{ cases | length }} registry verdict cases passed, plus {{ addresses | length }} address cases."
