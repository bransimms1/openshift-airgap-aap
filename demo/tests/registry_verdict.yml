---
# Fixture-driven tests for playbooks/tasks/registry_verdict.yml.
#
#   ansible-playbook -i localhost, demo/tests/registry_verdict.yml
- name: Registry verdict
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same default the playbook uses when a mirror host carries no port.
    registry_port_default: 8443
    addresses:
      # --- accepted ---------------------------------------------------------
      - {host: "registry.example.com", hostname: "registry.example.com", port: "8443", error: ""}
      - {host: "registry.example.com:8443", hostname: "registry.example.com", port: "8443", error: ""}
      - {host: "registry.example.com:443", hostname: "registry.example.com", port: "443", error: ""}
      - {host: "registry.example.com:5000", hostname: "registry.example.com", port: "5000", error: ""}
      - {host: "10.42.10.5", hostname: "10.42.10.5", port: "8443", error: ""}
      - {host: "10.42.10.5:5000", hostname: "10.42.10.5", port: "5000", error: ""}
      - {host: "[2001:db8::1]", hostname: "2001:db8::1", port: "8443", error: ""}
      - {host: "[2001:db8::1]:8443", hostname: "2001:db8::1", port: "8443", error: ""}
      - {host: "2001:db8::1", hostname: "2001:db8::1", port: "8443", error: ""}
      - {host: "registry.example.com:65535", hostname: "registry.example.com", port: "65535", error: ""}
      # --- rejected ---------------------------------------------------------
      - {host: "registry.example.com:", error_contains: "port is empty"}
      - {host: "registry.example.com:notaport", error_contains: "not a number"}
      - {host: "[2001:db8::1", error_contains: "brackets"}
      - {host: "[2001:db8::1]:", error_contains: "port is empty"}
      - {host: "https://registry.example.com:8443", error_contains: "scheme"}
      - {host: "registry.example.com:8443/path", error_contains: "path"}
      - {host: "", error_contains: "empty"}
      - {host: "registry.example.com:0", error_contains: "out of range"}
      - {host: "registry.example.com:70000", error_contains: "out of range"}
      - {host: "registry.example.com:8443:extra", error_contains: "not a valid host"}
    cases:
      # --- input hardening --------------------------------------------------
      - name: empty registry results cannot pass - nothing was probed
        reg: {results: []}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: missing registry results cannot pass
        reg: {}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: FAIL

      - name: string status "200" is normalised to CONFIRMED
        reg: {results: [{status: "200", item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: "200"}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: string status "401" is normalised to UNCONFIRMED
        reg: {results: [{status: "401", item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: "401"}
        cert_ok: true
        payload_state: UNCONFIRMED
        status: UNCONFIRMED

      - name: redirect 301 is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 301}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: redirect 302 is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 302}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: redirect 307 is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 307}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: 403 is MISSING - forbidden is not authentication required
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 403}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: missing payload status is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: malformed payload status string is MISSING
        reg: {results: [{status: "notaport", item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: "two hundred"}
        cert_ok: true
        payload_state: MISSING
        unreachable: ["r:8443"]
        status: FAIL

      - name: null payload status is MISSING
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: null}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: null not_after is not a usable certificate
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: null}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: whitespace-only not_after is not a usable certificate
        reg: {results: [{status: 200, item: "r:8443"}]}
        cert: {not_after: "   "}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: everything verified
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        status: PASS

      - name: authenticated mirror - payload unconfirmed, not PASS
        reg: {results: [{status: 401, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 401}
        cert_ok: true
        payload_state: UNCONFIRMED
        status: UNCONFIRMED

      - name: release repository missing (404)
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 404}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: payload probe did not run at all
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {failed: true}
        cert_ok: true
        payload_state: MISSING
        status: FAIL

      - name: certificate could not be read
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {failed: true, msg: "handshake failure"}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: certificate present but empty not_after
        reg: {results: [{status: 200, item: "registry.example.com:8443"}]}
        cert: {not_after: ""}
        payload: {status: 200}
        cert_ok: false
        payload_state: CONFIRMED
        status: FAIL

      - name: a host did not answer on /v2/
        reg: {results: [{status: 200, item: "a.example.com:8443"}, {status: -1, item: "b.example.com:8443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 200}
        cert_ok: true
        payload_state: CONFIRMED
        unreachable: ["b.example.com:8443"]
        status: FAIL

      - name: unreachable host outranks an unconfirmed payload
        reg: {results: [{status: 503, item: "a.example.com:443"}]}
        cert: {not_after: "20270101000000Z"}
        payload: {status: 401}
        cert_ok: true
        payload_state: UNCONFIRMED
        unreachable: ["a.example.com:443"]
        status: FAIL
  tasks:

    - name: Grade every fixture through the shipped rules
      ansible.builtin.include_tasks: registry_case.yml
      vars:
        _reg: "{{ case.reg }}"
        _cert: "{{ case.cert }}"
        _payload: "{{ case.payload }}"
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Verify mirror-host parsing and validation
      ansible.builtin.include_tasks: mirror_host_case.yml
      vars:
        _mh: "{{ addr.host }}"
        # The tests assert on the error string rather than aborting the run.
        mirror_host_fail_on_error: false
      loop: "{{ addresses }}"
      loop_control:
        loop_var: addr
        label: "{{ addr.host | default('(empty)') }}"

    - name: Report the number of cases graded
      ansible.builtin.debug:
        msg: "{{ cases | length }} registry verdict cases passed, plus {{ addresses | length }} address cases."
