---
# Fixture-driven tests for playbooks/tasks/bmc_classify.yml.
#
# The playbook and these tests include the SAME task file, so a change to the
# classification rules is graded here rather than only in production.
#
#   ansible-playbook -i localhost, demo/tests/bmc_classification.yml
- name: BMC classification
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cases:
      - name: no redfish_facts at all (suppressed connection failure)
        sys: {failed: true, msg: "connection refused"}
        fw: {failed: true}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: empty entries list
        sys: {redfish_facts: {system: {entries: []}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: error-only mapping must not pass
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"},
                   {error: {code: "Base.1.0.GeneralError", message: "A general error has occurred"}}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      # A degraded response that carries an error alongside otherwise-valid
      # fields. Without an explicit error rejection this reads as a healthy
      # system, because it has both an identifier and a PowerState.
      - name: error alongside valid fields must still be rejected
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"},
                   {error: {code: "Base.1.0.GeneralError"}, Id: "System.Embedded.1", PowerState: "On"}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: metadata-only mapping must not pass (no identifier, no PowerState)
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"}, {Model: "PowerEdge R650"}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: identifier present but no PowerState must not pass
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"}, {Id: "System.Embedded.1", Model: "R650"}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: valid system record
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"},
                   {Id: "System.Embedded.1", PowerState: "On", Model: "R650"}]
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.15.1"}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: MATCH

      - name: empty first record followed by a valid one
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"}, {}]
                - [{system_uri: "/redfish/v1/Systems/2"},
                   {Id: "System.Embedded.2", PowerState: "Off", Model: "R650"}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "Off"
        firmware_state: UNKNOWN_INSTALLED

      # --- values, not just keys -------------------------------------------
      - name: "Id: null must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: null, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: 'Id: "" must not pass'
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: whitespace-only identifier must not pass
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {SerialNumber: "   ", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "PowerState: null must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "System.Embedded.1", PowerState: null}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: 'PowerState: "" must not pass'
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "System.Embedded.1", PowerState: ""}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: unrecognised PowerState must not pass
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "System.Embedded.1", PowerState: "Melted"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: numeric identifier is usable once normalised
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: 1, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      # --- malformed entries must not crash ---------------------------------
      - name: entry whose second element is not a mapping
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, "not-a-mapping"]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: entry that is a bare string
        sys: {redfish_facts: {system: {entries: ["garbage"]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: entry that is an empty list
        sys: {redfish_facts: {system: {entries: [[]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: entry that is a bare mapping rather than a pair
        sys: {redfish_facts: {system: {entries: [{Id: "x", PowerState: "On"}]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: malformed entry followed by a valid pair
        sys:
          redfish_facts:
            system:
              entries:
                - "garbage"
                - [{system_uri: "/redfish/v1/Systems/2"}, {Id: "System.Embedded.2", PowerState: "On"}]
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.15.1"}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: MATCH

      # --- firmware normalisation -------------------------------------------
      - name: empty baseline is BASELINE_UNSET, not DRIFT
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: ""}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: whitespace-only baseline is BASELINE_UNSET
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: "   "}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: null baseline is BASELINE_UNSET
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: null}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: padded and upper-cased rollback Id is excluded
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw:
          redfish_facts:
            firmware:
              entries:
                - {Name: "BIOS", Id: "  ROLLBACK-159-2.14.0 ", Version: "2.14.0"}
                - {Name: "BIOS", Id: " Previous-159-2.13.0", Version: "2.13.0"}
                - {Name: "BIOS", Id: "Installed-159-2.15.1", Version: "2.15.1"}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "2.15.1"
        firmware_state: MATCH

      - name: only a rollback image reported is UNKNOWN_INSTALLED
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Id: "Previous-1-2.14.0", Version: "2.14.0"}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: integer firmware version is normalised to a string
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: 2}]}}}
        baseline: {bios_version: "2"}
        reachable: true
        bios_installed: "2"
        firmware_state: MATCH

      - name: float firmware version is normalised to a string
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: 2.15}]}}}
        baseline: {bios_version: "2.15"}
        reachable: true
        bios_installed: "2.15"
        firmware_state: MATCH

      - name: null firmware version is UNKNOWN_INSTALLED
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: null}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: empty firmware version is UNKNOWN_INSTALLED
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "  "}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      # --- control characters in identifiers ---------------------------------
      - name: "Id: NUL only must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/s/1"}, {Id: "\u0000", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id: tab only must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/s/1"}, {Id: "\t", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id with an embedded NUL must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/s/1"}, {Id: "ABC\u0000DEF", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id with an embedded newline must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/s/1"}, {Id: "ABC\nDEF", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id with surrounding whitespace is trimmed and accepted"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/s/1"}, {Id: " System.Embedded.1 ", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id with vendor punctuation is accepted"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/s/1"}, {Id: "ABC-123_456", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      # --- first element of the (uri, record) pair ---------------------------
      - name: reversed pair - two system records, no uri key
        sys:
          redfish_facts:
            system:
              entries:
                - - {Id: "System.1"}
                  - {Id: "System.2", PowerState: "On"}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: first element is a list
        sys: {redfish_facts: {system: {entries: [[["/s/1"], {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: first element is null
        sys: {redfish_facts: {system: {entries: [[null, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: first element is a boolean
        sys: {redfish_facts: {system: {entries: [[true, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: first element is a bare uri string
        sys: {redfish_facts: {system: {entries: [["/redfish/v1/Systems/1", {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: chassis_uri metadata key is also accepted
        sys: {redfish_facts: {system: {entries: [[{chassis_uri: "/redfish/v1/Chassis/1"}, {Id: "c1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      - name: malformed and valid entries interleaved
        sys:
          redfish_facts:
            system:
              entries:
                - - {Id: "reversed.1"}
                  - {Id: "reversed.2", PowerState: "On"}
                - "garbage"
                - [{system_uri: "/s/9"}, {Id: "System.Embedded.9", PowerState: "Off"}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "Off"
        firmware_state: UNKNOWN_INSTALLED

      # --- identifier TYPE rules --------------------------------------------
      - name: "Id: false must not pass (false | string is 'False')"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: false, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id: true must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: true, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id: [] must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: [], PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id: {} must not pass"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: {}, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      # Numeric zero IS a valid identifier - documented decision.
      - name: "Id: 0 is accepted"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: 0, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      - name: "Id: 12345 is accepted"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: 12345, PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      - name: 'Id: "0" is accepted'
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "0", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      - name: valid SerialNumber alone is enough
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {SerialNumber: "CN7016", PowerState: "Off"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "Off"
        firmware_state: UNKNOWN_INSTALLED

      - name: valid ServiceTag alone is enough
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {ServiceTag: "7XK2M3", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED

      # --- malformed entry SHAPES -------------------------------------------
      - name: "entries: null"
        sys: {redfish_facts: {system: {entries: null}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: 'entries: "not-a-list"'
        sys: {redfish_facts: {system: {entries: "not-a-list"}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: entry with one element only
        sys: {redfish_facts: {system: {entries: [[{Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: entry with three elements
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}, "extra"]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: entry whose second element is a list
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, []]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      - name: deeply nested entry
        sys: {redfish_facts: {system: {entries: [[[["deeply-nested"]]]]}}}
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: false
        firmware_state: UNKNOWN_INSTALLED

      # --- firmware TYPE rules ----------------------------------------------
      - name: "baseline: [] is BASELINE_UNSET"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: []}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: "baseline: {} is BASELINE_UNSET"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: {}}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: "baseline: true is BASELINE_UNSET"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: true}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: "baseline: 0 is a usable numeric baseline"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: 0}]}}}
        baseline: {bios_version: 0}
        reachable: true
        bios_installed: "0"
        firmware_state: MATCH

      - name: 'baseline: "0" is a usable string baseline'
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "0"}]}}}
        baseline: {bios_version: "0"}
        reachable: true
        bios_installed: "0"
        firmware_state: MATCH

      - name: "version: true is UNKNOWN_INSTALLED"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: true}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: "version: false is UNKNOWN_INSTALLED"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: false}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: "version: [] is UNKNOWN_INSTALLED"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: []}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: "version: {} is UNKNOWN_INSTALLED"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: {}}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: "firmware entries: null"
        sys: {redfish_facts: {system: {entries: [[{system_uri: "/redfish/v1/Systems/1"}, {Id: "s1", PowerState: "On"}]]}}}
        fw: {redfish_facts: {firmware: {entries: null}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "unknown"
        firmware_state: UNKNOWN_INSTALLED

      - name: error record followed by a valid one

        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"}, {error: {code: "Base.1.0.GeneralError"}}]
                - [{system_uri: "/redfish/v1/Systems/2"},
                   {Id: "System.Embedded.2", PowerState: "On"}]
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: DRIFT

      - name: multiple valid records selects the first deterministically
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/redfish/v1/Systems/1"},
                   {Id: "System.Embedded.1", PowerState: "On", Model: "first"}]
                - [{system_uri: "/redfish/v1/Systems/2"},
                   {Id: "System.Embedded.2", PowerState: "Off", Model: "second"}]
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.15.1"}]}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        model: first
        firmware_state: MATCH

      - name: Dell dual-BIOS selects the installed image, not the rollback
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/x"}, {Id: "System.Embedded.1", PowerState: "On"}]
        fw:
          redfish_facts:
            firmware:
              entries:
                - {Name: "BIOS", Id: "Previous-159-2.14.0", Version: "2.14.0"}
                - {Name: "BIOS", Id: "Installed-159-2.15.1", Version: "2.15.1"}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        bios_installed: "2.15.1"
        firmware_state: MATCH

      - name: no baseline declared is BASELINE_UNSET, not "no drift"
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/x"}, {Id: "System.Embedded.1", PowerState: "On"}]
        fw: {redfish_facts: {firmware: {entries: [{Name: "BIOS", Version: "2.14.0"}]}}}
        baseline: {}
        reachable: true
        bios_installed: "2.14.0"
        firmware_state: BASELINE_UNSET

      - name: identifier via SerialNumber rather than Id
        sys:
          redfish_facts:
            system:
              entries:
                - [{system_uri: "/x"}, {SerialNumber: "CN7016", PowerState: "On"}]
        fw: {redfish_facts: {firmware: {entries: []}}}
        baseline: {bios_version: "2.15.1"}
        reachable: true
        power: "On"
        firmware_state: UNKNOWN_INSTALLED
  tasks:

    - name: Grade every fixture through the shipped classification
      ansible.builtin.include_tasks: bmc_case.yml
      vars:
        _sys: "{{ case.sys }}"
        _fw: "{{ case.fw }}"
        firmware_baseline: "{{ case.baseline }}"
      loop: "{{ cases }}"
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Report the number of cases graded
      ansible.builtin.debug:
        msg: "{{ cases | length }} BMC classification cases passed."
